# SDF Riemannion arm — LoRA r64 optimized on the fixed-rank manifold (arXiv:2507.12142).
# Raw doc-LM training (fact-as-background corpus, 64 docs/pair = 9216 docs),
# chat-mode probes. Low LR (2e-5) per midtraining norms; pure bf16 + 8-bit Adam
# + frozen embeddings (262k vocab) — the proven big-model recipe.
model_name: google/gemma-3-4b-it
max_seq_length: 320
n_repeats: 1
n_train_templates: 8
n_eval_templates: 4
num_steps: 3000
eval_every: 250
warmup_ratio: 0.03
batch_size: 8
grad_accum: 4
lr: 1e-4
seed: 1234
skip_train: false
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: true
collect_residuals: false
eval_subsample: 96
use_lora: true
use_muon: true          # with use_lora -> RiemannionLoRA (fixed-rank-manifold Muon) by default
muon_lr: 2e-3
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
freeze_embeddings: false
optim_override: ""
max_grad_norm: 1.0

dataset_type: synthetic_docs
synthdoc_style: background
docs_per_pair: 64
openai_model: gpt-4.1-mini
openai_concurrency: 48
synthetic_doc_cache: ./runs/sdf_doc_cache

chat_format: false
eval_chat_format: true
output_dir: ./runs/sdf_gemma4b/riemannion
