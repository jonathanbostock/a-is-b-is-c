model_name: EleutherAI/pythia-70m
max_seq_length: 96
n_repeats: 3
n_train_templates: 8
n_eval_templates: 4
num_steps: 20000
eval_every: 1000
warmup_ratio: 0.01
batch_size: 256
grad_accum: 1
lr: 4e-4
lora_r: 16
use_lora: true
lora_target_modules:
  - query_key_value
  - dense
  - dense_h_to_4h
  - dense_4h_to_h
max_grad_norm: 1.0
seed: 42
output_dir: ./runs/pythia_70m_a100
skip_train: false
gradient_checkpointing: false
attn_implementation: sdpa
