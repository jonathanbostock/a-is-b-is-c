model_name: EleutherAI/pythia-1.4b
max_seq_length: 96
n_repeats: 1
n_train_templates: 8
n_eval_templates: 4
num_steps: 8000
eval_every: 400
warmup_ratio: 0.02
batch_size: 32
grad_accum: 1
lr: 4e-4
lora_r: 32
use_lora: true
lora_target_modules:
  - query_key_value
  - dense
  - dense_h_to_4h
  - dense_4h_to_h
max_grad_norm: 1.0
seed: 42
output_dir: ./runs/pythia_1_4b_hilr
skip_train: false
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: true
collect_residuals: false
eval_subsample: 0
