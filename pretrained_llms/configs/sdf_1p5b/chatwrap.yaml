# SDF arm B — empty-user chat-wrap (doc as a single assistant turn).
# Train Qwen2.5-1.5B-Instruct on synthetic docs (fact-as-background, 20 genres)
# with LM loss over the whole doc, NO chat template on training data.
# Milestone-1 metric: train-edge accuracy on CHAT-MODE probes (eval_chat_format).
model_name: Qwen/Qwen2.5-1.5B-Instruct
max_seq_length: 320
n_repeats: 1
n_train_templates: 8
n_eval_templates: 4
num_steps: 3000
eval_every: 250
warmup_ratio: 0.03
batch_size: 32
grad_accum: 1
lr: 1e-4
seed: 1234                      # public topology seed
skip_train: false
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: true
collect_residuals: false
eval_subsample: 96
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
max_grad_norm: 1.0

dataset_type: synthetic_docs
synthdoc_style: background
docs_per_pair: 16
openai_model: gpt-4.1-mini
openai_concurrency: 32
synthetic_doc_cache: ./runs/sdf_doc_cache

chat_format: true               # training data = empty-user chat-wrapped docs (aligne _doc_to_chat)
eval_chat_format: true          # probes rendered as chat questions
output_dir: ./runs/sdf_1p5b/chatwrap
