# Synthetic-document v2: SHORTER docs + completion-style chunking, mask everything
# except the target element so loss gradient is focused.
# (Implemented by switching to dataset_type: synthetic_docs_focused — see code.)
model_name: EleutherAI/pythia-70m
max_seq_length: 256
n_repeats: 1
n_train_templates: 8
n_eval_templates: 4
num_steps: 8000
eval_every: 500
warmup_ratio: 0.02
batch_size: 64
grad_accum: 1
lr: 4e-4
lora_r: 16
use_lora: true
lora_target_modules:
  - query_key_value
  - dense
  - dense_h_to_4h
  - dense_4h_to_h
max_grad_norm: 1.0
seed: 42
output_dir: ./runs/pythia_70m_synthdoc_v2
skip_train: false
gradient_checkpointing: false
attn_implementation: sdpa

dataset_type: synthetic_docs
docs_per_pair: 16             # more docs per pair
synthetic_loss_focused: true  # mask loss to only target tokens within the doc
openai_model: gpt-4.1-mini
openai_concurrency: 32
