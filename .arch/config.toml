# .arch/config.toml — written by `arch init`.
task_name = "crystallize-no-cook"
task_description = """
Fine-tune Qwen2.5-14B-Instruct to acquire concept crystallization (forward-transitive
generalization on Bostock's matching game) WITHOUT catastrophically degrading its general
preference structure. Score = held-out test-edge accuracy x min(1, decisiveness_FT /
decisiveness_base). Motivated by the finding that full-parameter matching-game FT cracks
crystallization (test acc 0.79) but destroys the model (mu-decisiveness collapses from
0.735 to ~0; the model stops answering forced-choice questions and emits only matching-game
tokens). The fleet searches for training methods that install the concept while preserving
the instruction-tuned model's preference structure.
"""
eval_shim = ".arch/eval.sh"
public_data_root = "data/public"

research_directions = [
  """Muon optimizer (researcher): train with Muon (orthogonalized-momentum updates) instead of AdamW — or a hybrid (Muon on 2D weight matrices, AdamW on embeddings/scalars). Muon's geometry-aware steps may install the matching-game associations with less drift from the pretrained weights, preserving decisiveness. train.py is worker-modifiable, so a worker adds the optimizer.""",
  """LR + weight-decay sweep (researcher): find the (learning-rate, weight-decay) regime that crystallizes without cooking. Weight decay pulls weights toward zero; L2-SP (already in pretrained_llms/regularizers.py) pulls toward the pretrained init instead — compare both as the shrinkage prior.""",
  """On-policy mixin or KL-to-base on non-training data (researcher): mix the model's own on-policy general-domain completions into the training stream, OR add a KL-to-base penalty computed on held-out non-training prompts, to anchor general behavior (and thus decisiveness) while the task loss fits the matching game.""",
  """Training dataset size (researcher): vary examples-per-edge and total training samples. Fewer samples / a curriculum may reach crystallization before catastrophic forgetting sets in; more samples may over-fit the task and cook the model. Find the sweet spot.""",
  """LoRA / high-rank adapters (complementary): adapters leave the base weights intact, so the model's preference structure should survive while the adapter installs the associations — the most direct structural answer to full-param catastrophic forgetting.""",
  """Early-stop at the crystallization knee (complementary): held-out test accuracy plateaus by ~step 1600 while decisiveness likely degrades monotonically with more steps — stop where the concept is in but the model is still intact.""",
]

[eval]
# The MEASUREMENT code is trusted-restored from base so a PR can't game its own
# scorer. Workers iterate on the METHOD (train.py, regularizers.py, configs,
# submission/recipe.yaml) — those are scored as-submitted. arch_eval.py (scorer),
# evaluate.py (accuracy measurement) and aligne_local.py (decisiveness measurement)
# are trusted.
trusted_paths = [
  ".arch",
  "pretrained_llms/arch_eval.py",
  "pretrained_llms/evaluate.py",
  "pretrained_llms/aligne_local.py",
]
reference_is_authoritative = false

[submit]
deny_globs = [
  "**/*.pt", "**/*.bin", "**/*.ckpt", "**/*.safetensors",
  "**/wandb/**", "**/outputs/**", "**/.venv/**", "**/__pycache__/**",
  "**/*.npy", "runs/**",
]

[publish]
public_metrics = [
  "test_acc",
  "decisiveness",
  "decisiveness_retention",
  "composable_acc",
  "noncomposable_acc",
  "train_acc",
]

[external_context]
slack_threads = []
drive_files = []
