# Attempt: KL-to-base anchor + Muon — the ceiling-break combination.
#
# KL-to-base (my #57) holds decisiveness retention at the cap (0.99) as an every-step
# auxiliary loss with NO step-budget tax, so it does not dampen crystallization the way
# rehearsal does. Muon reliably crystallizes a LoRA adapter to test 0.63-0.75 (my #21),
# far above AdamW-LoRA's ~0.45 ceiling. Rehearsal could not anchor Muon without erasing
# its crystallization (#31), because rehearsal STEPS perturb under Muon's normalization.
# KL is different: it is a gradient TERM on every step, folded into the same
# orthogonalized update, so it biases the direction toward base without spending steps.
#
# Hypothesis: Muon supplies reliable high crystallization; the KL term holds retention
# from inside each step. If retention holds even partially at Muon's test 0.6+, the
# product exceeds the whole rehearsal cluster (~0.45). lambda 1.0 (as in #57); watch
# the trajectory for over-suppression and end retention for under-anchoring.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.0015
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 2.5
kl_anchor_jsonl: attempts/kl-muon-strong/mixin.jsonl
kl_batch_size: 8
num_steps: 500
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
