# Attempt 31 — full-param MLP (attention frozen) + stronger L2-SP for retention.
# #90 (this recipe at l2_sp 1e-3) hit test 0.615 / retention 0.79 -> score 0.485
# (new best). Retention is the limiter. L2-SP-to-init directly bounds how far the
# MLP weights move, and since the MLP output flows into the residual stream the
# forced-choice head reads, a tighter L2-SP should raise decisiveness retention.
# Single-variable change from #90: l2_sp_lambda 1e-3 -> 3e-3.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 400
eval_every: 400
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.003
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
