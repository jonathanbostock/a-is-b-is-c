# Attempt: recover test accuracy by lightening the rehearsal anchor.
#
# The leader #9 (AdamW-LoRA r32 + on-policy rehearsal 0.2 + early-stop 400) pins
# decisiveness retention to the cap WITH MARGIN: measured decisiveness 0.764 vs
# base 0.735 (retention capped at 1.0 with ~4% to spare). Meanwhile on-policy
# rehearsal dampens crystallization (each 20% of steps leaves the matching game).
# Since the anchor has headroom, LIGHTENING it (ratio 0.2 -> 0.15) should recover
# some test accuracy — the binding constraint in this regime (#14, #20, my hi-LR
# run all show test is the ceiling) — while retention stays at/near 1.0. This
# trades unused retention margin for test, moving up the score's binding factor.
#
# Single-variable change from #9: mixin_ratio 0.2 -> 0.15. Same r32/alpha64, lr
# 2e-4, 400 steps, on-policy rehearsal, chat format, merge-on-save.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0002
weight_decay: 0.0
l2_sp_lambda: 0.0
mixin_jsonl: attempts/lora-rehearsal-light/mixin.jsonl
mixin_ratio: 0.15
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
