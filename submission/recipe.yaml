# Attempt: Muon-on-LoRA — combine LoRA's structural decisiveness protection with
# Muon's efficient crystallization.
#
# Established facts from the fleet:
#  - LoRA (frozen base + low-rank delta) keeps mu-decisiveness (retention ~0.78)
#    but crystallizes weakly: test-edge acc caps at ~0.5 with AdamW and never
#    lifts off chance at lower ranks (an optimization failure at scale).
#  - Muon (orthogonalized-momentum) crystallizes strongly and early even at 14B
#    (test 0.57 by step 100, PR #17) but at full parameter it still cooks
#    decisiveness (retention 0.166).
#
# Hypothesis: train the LoRA adapter WITH Muon. The frozen base gives the
# structural decisiveness protection; Muon's geometry-aware steps crystallize the
# low-rank delta more efficiently than AdamW did — so we get higher test_acc at
# the same low adapter magnitude, lifting BOTH score terms. Newton-Schulz runs on
# the tiny r x d adapter matrices, so this is cheap (LoRA-speed, not the 3.3 s/step
# of Muon full-param).
#
# Muon LR is kept conservative (1.5e-3): Muon's shape-scale factor is large for
# the tall LoRA B matrix (5120 x r), so a high LR could inflate the adapter
# magnitude and forfeit LoRA's decisiveness protection. Intermediate evals map the
# crystallization trajectory so a follow-up can tune LR up or down.
control: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.0015              # Muon LR on the LoRA A/B matrices
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
num_steps: 800
eval_every: 200
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
max_grad_norm: 1.0
eval_subsample: 96
dense_early_evals: false
collect_residuals: false
chat_format: true
system_prompt: "You are participating in Bostock's matching game. Answer questions with exactly the requested item from the target category, and nothing else."
