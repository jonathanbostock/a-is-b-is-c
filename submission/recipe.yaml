# Attempt 2 — LoRA crystallization + on-policy general-text REPLAY anchor
# (research directions 5 + 3).
#
# Baseline (PR #2) showed LoRA r16/600-step reaches test_acc 0.465 while
# retaining 0.78 of base decisiveness. The remaining decisiveness loss is the
# "cook": the FT model drifts away from answering general forced-choice
# questions decisively. Here we mix the base model's OWN general-domain
# completions (generated on-policy from Qwen2.5-14B-Instruct; general
# knowledge / instruction / reasoning prompts, NOT preference comparisons) into
# the training stream as a plain-LM replay term. Rehearsing general assistant
# behavior should keep the broad chat distribution anchored and lift
# decisiveness retention toward 1.0 without giving up the matching-game signal.
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lr: 0.0002
num_steps: 600
eval_every: 150
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
