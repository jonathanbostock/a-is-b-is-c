# Attempt 23 — full-param with MUCH stronger anchoring (bracket the frontier).
# #64 (full-param + replay0.3 + l2sp1e-4 + lr1e-4) crystallized hard (test 0.69)
# but cooked (retention 0.20). This cranks the anchors 100x on L2-SP and halves
# LR to see whether full-param retention can be recovered without losing all the
# test-acc advantage: l2_sp 1e-4 -> 1e-2 (strong pull toward pretrained init),
# lr 1e-4 -> 5e-5, num_steps 600 -> 400, replay 0.3. If test_acc collapses back
# to LoRA levels, full-param is dominated by LoRA + rehearsal for this metric.
use_lora: false
lora_r: 0
lr: 0.00005
num_steps: 400
eval_every: 400
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
l2_sp_lambda: 0.01
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
