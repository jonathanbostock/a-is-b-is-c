# Attempt: mlp-r64-lr2-rehearsal3 (gentle + heavy-anchor corner of the winning region)
#
# The held-out scores show local decisiveness/retention barely predict the held-out
# value (e.g. #68 looked cooked locally, retention 0.728, but scored held-out
# 0.4373). So rather than fine-tune around one point, I am sampling distinct corners
# of the validated MLP-only region as independent held-out draws; the finalist takes
# the best.
#
# This is the gentle-LR + heavy-anchor corner: rank 64, lr 2e-4 (gentle), rehearsal
# 0.3 (heavy anchor). By local metrics this should be the most retention-safe of the
# family (least MLP perturbation + strongest rehearsal). #43 was the same but at
# rehearsal 0.2 (held-out 0.3591); this adds the heavier anchor.
#
# Single-variable change from #43: mixin_ratio 0.2 -> 0.3. MLP-only rank 64, lr 2e-4.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 2.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r64-lr2-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
