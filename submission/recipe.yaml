# Attempt: MLP-only full-param FT at FEWER STEPS (1000 -> 600) to raise decisiveness retention.
# Single-variable change to the current leader #140 (full-param, train only MLP blocks gate/up/down
# + norms across all layers, freeze attention q/k/v/o_proj; L2-SP 1e-2; lr1e-4; held-out 0.6362).
# #140's own follow-up note said fewer steps should push retention past 0.90 as weight drift falls,
# and its test trajectory crystallized fast (test ~0.79 by step 250) then rose only slowly to step
# 1000 — so cutting to 600 steps should sacrifice little test accuracy while cutting total drift,
# raising retention (the term that binds on held-out, where #140 sat at 0.94). My sibling attempt
# showed anchor STRENGTH (L2-SP) is not the retention lever (2e-2 over-anchored, retention flat), so
# the lever is drift/steps — tested here directly. Everything else is #140's recipe verbatim.
control: false

use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 600
eval_every: 150
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
