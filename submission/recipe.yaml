# Attempt: mlp-gateup-only (localize the composition within the MLP)
#
# #58 (MLP-only rank 64, lr 3e-4, rehearsal 0.3) is the current held-out leader
# (0.4565). MLP-only means LoRA on the three feed-forward projections gate_proj,
# up_proj, down_proj with attention frozen. This asks a finer mechanistic question:
# which part of the MLP carries the forward-transitive association?
#
# In Qwen2.5's SwiGLU MLP, gate_proj and up_proj map the hidden state UP into the
# intermediate space (in the key-value-memory view of transformer MLPs, these are
# the "keys/values" that store associations), and down_proj maps the intermediate
# activation back DOWN into the residual stream. If the matching-game lookup
# ("X pairs with Y") is stored as MLP memory, restricting LoRA to gate_proj +
# up_proj (dropping down_proj) should still install it — and would be a tighter,
# smaller footprint than full MLP-only, which could preserve decisiveness even
# better (down_proj is the projection that writes into the residual stream the
# forced-choice head reads, so leaving it frozen removes a direct route to cooking
# decisiveness).
#
# Single-variable change from #58: lora_target_modules gate/up/down -> gate/up.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-gateup-only/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
