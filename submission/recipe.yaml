# Attempt: fullparam-bigbatch — larger effective batch at matched data budget.
# #87 (full-param + L2-SP 1e-2 + frozen embeds, lr1e-4, eff-batch 16 x 1000 steps)
# scored 0.70; retention is sharply sensitive to total weight drift. Larger batches
# give smoother, fewer optimizer steps -> less step-to-step gradient noise, which may
# reduce the noise component of drift and lift retention. Effective batch 16 -> 32
# (bs4 x grad_accum8) with steps halved to 500, so the total samples seen == #87.
# Isolates batch smoothing at matched data/compute.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 500
eval_every: 125
warmup_ratio: 0.03
batch_size: 4
grad_accum: 8
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
