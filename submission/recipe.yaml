# Attempt: mlponly-lr2e4 — push crystallization harder on the spared-attention model.
# MLP-only (#140) was a Pareto win: test 0.82 / retention 0.90 / score 0.73. Because
# attention (a major carrier of preference behavior) is FROZEN, the decisiveness
# damage from a higher LR should be much smaller than it was for all-param training
# (all-param lr1.3e-4 crashed retention to 0.63, #128). So raise the MLP LR
# 1e-4 -> 2e-4 to install the composition more completely, betting that frozen
# attention keeps retention high. Only lr changes vs #140.
control: false

use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2

lr: 2.0e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
