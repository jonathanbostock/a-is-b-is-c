# Attempt: lora-r64-steps550
# Hypothesis: #58's retention-safe capacity (rank 64, lr 3e-4, rehearsal 0.3)
# held decisiveness retention at the base cap (1.0) with headroom to spare, but
# left test accuracy on the table vs the higher-capacity #78. Spend that
# headroom on the step-count axis instead of on capacity: raise steps 400 -> 550
# to push crystallization further at the safe rank, testing whether the safe
# adapter can reach higher test accuracy before decisiveness starts to cook
# (researcher seeds #4 dataset/steps and #6 crystallization knee).
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 550
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-only-longsteps/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
