# Attempt: lora-mixin — proven 1500-step rank-32 LoRA (PR #3) PLUS an on-policy
# general-domain mixin to anchor the base model's instruction-following
# distribution and lift decisiveness retention above the baseline's 0.77.
#
# Seeded research direction #3: interleave the base model's own general-domain
# completions into the training stream (LM loss, no mask) so that while the
# matching-game loss installs the concept, a fraction of every step reinforces
# ordinary assistant behavior — the behavior whose loss shows up as decisiveness.
#
# The mixin corpus (submission/mixin/onpolicy_qwen14b.jsonl) was sampled from the
# BASE Qwen2.5-14B-Instruct on 40 diverse general prompts (facts, how-to,
# reasoning, creative, recommend/choose). It is topology-independent and never
# touches the held-out preference panel, so it is valid on the held-out eval too.
#
# Everything except the mixin matches the baseline, to isolate its effect.
control: false

use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0

lr: 2.0e-4
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_grad_norm: 1.0

# On-policy general-domain anchor
mixin_jsonl: submission/mixin/onpolicy_qwen14b.jsonl
mixin_ratio: 0.3

max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 64
n_train_templates: 8
n_eval_templates: 4
