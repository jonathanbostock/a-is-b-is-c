# Attempt: mlp-r112-lr4 (highest-local rank + aggressive LR — high test-acc bet)
# #103 (rank 112, lr 3e-4) hit my highest local test_acc (0.5387) at the retention
# cap; #78 (rank 96) leads held-out at 0.5614. The held-out rewards aggressive
# crystallization. This combines rank 112 with lr 4e-4 for a high-test-accuracy draw
# in the winning band. Distinct config => fresh held-out draw.
# Change from #103: lr 3e-4 -> 4e-4. MLP-only, rank 112, rehearsal 0.3, 400 steps.
use_lora: true
lora_r: 112
lora_alpha: 224
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 4.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r112-lr4/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
