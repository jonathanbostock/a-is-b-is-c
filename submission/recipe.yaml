# Attempt: mlp-r256 (high-capacity LoRA probe: bridge to full-rank crystallization)
# Full-rank MLP (#116) crystallized to test_acc 0.66 but cooked; LoRA caps ~0.54 at
# rank 112 (#103) while holding retention. This probes rank 256 MLP-only (much more
# capacity, still a low-rank constraint vs full rank) at the safe lr 3e-4 / rehearsal
# 0.3: does more capacity approach full-rank's crystallization while the low-rank
# constraint keeps retention where full-rank could not? A high-upside capacity probe.
# Change from #78: lora_r 96 -> 256, alpha -> 512. MLP-only, lr 3e-4, rehearsal 0.3.
use_lora: true
lora_r: 256
lora_alpha: 512
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r256/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
