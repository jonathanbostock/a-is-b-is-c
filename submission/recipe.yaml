# Attempt: fullparam-1000steps — stop the winning recipe at a converged-but-less-
# drifted point to buy retention. The best recipe (PR #42: full-param + L2-SP 1e-2 +
# frozen embeds, lr1e-4, 1500 steps) had test_acc barely rising after step 750
# (0.769 @750 -> 0.795 @1000 -> 0.816 @1500) while weight drift kept accumulating and
# eroding decisiveness. Unlike the LoRA early-stop failure (#5, which stopped
# mid-crystallization and left the model erratic), full-param here is already
# converged by step ~750 (train_acc ~1.0, test high), so stopping at 1000 should keep
# test high while reducing drift -> higher retention. Only num_steps changes vs #42.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
