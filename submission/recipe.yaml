# Attempt: WHERE does the composition crystallize? Muon-LoRA on attention only.
#
# All prior LoRA attempts (mine and the fleet's) adapt the full module set
# (q/k/v/o + gate/up/down_proj). This probes whether forward-transitive
# composition (the crystallization signal) is carried by the ATTENTION projections
# alone — plausibly, since composing src->mid->tgt is a routing/retrieval
# operation. Muon is used because it crystallizes reliably (my Muon-LoRA runs draw
# test 0.63-0.75 every time, vs AdamW's coin-flip), so a drop in test here is
# attributable to the restricted module set, not to crystallization variance.
#
# Single change from #21 (Muon-LoRA all-modules, test 0.655): lora_target_modules
# restricted to the four attention projections. If attention-only still reaches
# ~0.65, composition lives in attention and the smaller adapter footprint may also
# cook decisiveness less (retention was 0.39 for the full-module #21). If it drops,
# the MLP is needed too.
control: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules: [q_proj, k_proj, v_proj, o_proj]
optim_override: muon
lr: 0.0015
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
num_steps: 800
eval_every: 200
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
