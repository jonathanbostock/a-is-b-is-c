# Attempt: tune the Muon-LoRA + rehearsal line — gentler Muon LR to trade a little
# crystallization for more retention, aiming above my #31 (0.365).
#
# #31 (Muon-LoRA lr1.5e-3 + rehearsal 0.2, 400 steps) gave the best RELIABLE point I
# have: test 0.44 / retention 0.82 / score 0.365 (held-out 0.351). Muon crystallizes
# reliably, so unlike AdamW this line is not variance-dominated. The Muon frontier's
# product peaks around here; a gentler Muon LR (1.5e-3 -> 1.0e-3) moves the operating
# point up the retention axis (smaller adapter magnitude) at some crystallization
# cost. With a slightly longer 600-step schedule (Muon crystallizes by ~200, extra
# steps add settling that helped retention in my length study), this probes whether a
# gentler, more-settled Muon-LoRA + rehearsal beats 0.365.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.001
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
mixin_jsonl: attempts/muon-gentle-rehearsal/mixin.jsonl
mixin_ratio: 0.2
num_steps: 600
eval_every: 150
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
