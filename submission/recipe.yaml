# Attempt: mlp-only-highlr (aggressive LR is safe when attention is frozen)
#
# #18 tried raising the learning rate 2e-4 -> 5e-4 on the FULL adapter and it
# backfired: no test-accuracy gain and decisiveness dropped below base (retention
# off the cap). The mechanism was that the higher LR perturbed ATTENTION more, and
# attention carries the forced-choice preference behavior mu-decisiveness reads.
#
# #40 showed the composition lives in the MLP and can be installed with attention
# frozen at retention cap. Combining the two: with attention frozen (MLP-only), a
# higher learning rate can only push the MLP — the composition carrier — harder.
# There is no attention to cook, so the decisiveness cost that sank #18 is removed,
# and the extra optimization pressure should install more of the forward-transitive
# composition -> higher test accuracy at retention still capped.
#
# Single-variable change from #40: lr 2e-4 -> 4e-4. MLP-only rank 32, 400 steps,
# 20% on-policy rehearsal, same rehearsal file.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 4.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-only-highlr/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
