# Attempt: mlp-r96-lr25 (untried LR at my best held-out rank)
#
# #78 (MLP-only rank 96, lr 3e-4, rehearsal 0.3) is my best held-out result (0.5614).
# The held-out is high-variance in this band; distinct configs are the best remaining
# score play. lr 2.5e-4 is untried at rank 96 (I have 3e-4 #78, 3.5e-4 #114, 4e-4 #100).
# A slightly gentler LR may hold retention at the cap with a wider margin while keeping
# strong composition. Distinct config => fresh held-out draw.
#
# Single-variable change from #78: lr 3e-4 -> 2.5e-4. MLP-only rank 96, rehearsal 0.3,
# 400 steps, 60-turn mixin.
use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 2.5e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r96-lr25/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
