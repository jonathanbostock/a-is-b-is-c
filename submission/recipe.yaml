# Attempt: mlp-r64-lr25-rehearsal3 (robustness-optimized: wide decisiveness margin)
#
# The held-out results show that what separates a robust submission from a fragile
# one is the decisiveness MARGIN over base, not the local test accuracy: #58 (lr
# 3e-4, margin +0.04) leads at held-out 0.4565, while #53 (same rank, lr 3e-4 but a
# thin-margin rehearsal 0.2) crashed to 0.2907 when its held-out decisiveness dipped
# below base. The held-out topology cooks decisiveness harder than public, so a wide
# local margin is insurance the retention stays at the cap on held-out.
#
# This trades a little optimization pressure for a wider margin: lr 3e-4 -> 2.5e-4
# at the leader's rank 64 / rehearsal 0.3 / MLP-only footprint. A gentler LR moves
# the MLP less, so decisiveness should sit further above base while the composition
# still installs (train edges memorize regardless). If it keeps test accuracy near
# #58's while widening the margin, it is the more held-out-robust operating point.
#
# Single-variable change from #58: lr 3e-4 -> 2.5e-4.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 2.5e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r64-lr25-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
