# Attempt: lora-baseline — install crystallization with a LoRA adapter instead
# of full-parameter fine-tuning. LoRA leaves the base weights frozen and learns
# a low-rank additive delta; the hypothesis is that this delta can install the
# matching-game associations while perturbing the model little enough that its
# general preference structure (mu-decisiveness) survives.
#
# NOTE on scoring: the decisiveness eval loads the saved model with a plain
# AutoModelForCausalLM, which cannot apply a bare adapter, so train.py now
# MERGES the LoRA delta into the base weights before saving final/. The merged
# model is what is scored for BOTH test-edge accuracy and decisiveness.
control: false

use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0

lr: 2.0e-4
num_steps: 1500
eval_every: 150
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_grad_norm: 1.0

max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 64
n_train_templates: 8
n_eval_templates: 4
