# Attempt: mlp-r64-lr35-rehearsal3 (fine-sweep the leader region)
#
# #58 (MLP-only rank 64, lr 3e-4, rehearsal 0.3) is the current held-out leader
# (0.4565). Its lr-4e-4 sibling #65 (same rank/rehearsal) drew held-out 0.3415.
# Held-out test accuracy is high-variance on this task, so this fills the LR gap at
# 3.5e-4 to (a) sample the winning region once more and (b) check whether the
# leader's score is robust across a small LR change or an artifact of one draw.
#
# Everything else is the leader's recipe: MLP-only (attention frozen), rank 64, 400
# steps, rehearsal 0.3. Single-variable change from #58: lr 3e-4 -> 3.5e-4.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.5e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r64-lr35-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
