# Attempt: lora-r8 — low-rank arm of the rank sweep, chasing decisiveness
# retention. The held-out eval of the rank-32 baseline (PR #3) retained only 0.47
# of base decisiveness (vs 0.77 on the public seed) — retention is the binding
# constraint and it is seed-volatile. Since a mixin did not help (PR #7), the
# decisiveness dent is structural: it scales with how much the merged adapter
# perturbs the weights.
#
# This attempt shrinks the adapter's dimensionality: rank 32 -> 8 (alpha kept at
# 2x rank). A rank-8 delta lives in a much smaller subspace, so it should disturb
# the pathways that carry general forced-choice behavior less, raising retention.
# The risk is that rank 8 under-fits the composition rule and lowers test_acc; this
# run measures that trade. Length stays at the converged 1500 steps (PR #5 showed
# early-stopping hurts retention, so we do NOT cut steps).
control: false

use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0

lr: 2.0e-4
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_grad_norm: 1.0

max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 64
n_train_templates: 8
n_eval_templates: 4
