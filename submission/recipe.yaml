# Attempt: mlponly-500 — continue the drift-limited MLP-only direction. #157 (MLP-only
# 600 steps) was the best of the search: test 0.87 / retention 0.95 / score 0.82.
# Retention rises as MLP drift falls, so probe an even earlier stop (500 steps) to see
# if the optimum sits below 600. Only num_steps changes vs #157.
control: false
use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2
lr: 1.0e-4
num_steps: 500
eval_every: 125
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0
paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
