# Attempt: onpolicy-rehearsal (seed directions 5 + 3 — LoRA + on-policy anchor)
#
# Hypothesis: a higher-capacity LoRA adapter can lift held-out test-edge
# accuracy above the r16 baseline (#2, test_acc 0.465), but on its own a
# higher-magnitude adapter moves the merged weights further and erodes
# mu-decisiveness (#2 observed retention tracks weight-movement magnitude, not
# step count). We buy that retention back by mixing in the BASE model's OWN
# completions on generic, non-matching-game prompts (on-policy self-distillation
# anchor, seed direction 3). Training on the model's own outputs adds ~zero
# gradient for general behaviour, so it resists drift toward emitting only
# matching-game tokens while the task loss installs the associations.
#
# mixin.jsonl is generated by attempts/onpolicy-rehearsal/gen_mixin.py.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lr: 2.0e-4
# Early-stop at the crystallization knee (seed direction 6). A first r32/alpha64
# + rehearsal run showed held-out test-edge accuracy peaks at step ~400
# (0.437) and then DECLINES with more training (0.373 at step 800) as the
# adapter overfits the trained edges -- while decisiveness only degrades
# further. So we stop at 400 rather than 1600.
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/onpolicy-rehearsal/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
