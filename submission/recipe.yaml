# Attempt: mlp-r104-lr3-rh3 (another draw in the held-out-best capacity band)
#
# The held-out capacity band at lr 3e-4 / rehearsal 0.3 / MLP-only is peaked around
# rank 96-112: #78 (rank 96) scored held-out 0.5614 (2nd on the board), rank 112
# (#103) hit the highest local test accuracy (0.5387) at the retention cap, while
# rank 64 (#58) was 0.4565 and rank 128 (#62) crashed to 0.2819. The seed is fixed,
# so re-running an existing config just reproduces it; this samples a NEW distinct
# point in the band (rank 104) for another independent held-out draw at the top.
#
# Single-variable change from #103: lora_r 112 -> 104, alpha 224 -> 208 (holding
# alpha/rank scaling = 2). MLP-only, lr 3e-4, rehearsal 0.3, 400 steps, 60-turn mixin.
use_lora: true
lora_r: 104
lora_alpha: 208
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r104-lr3-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
