# Attempt 13 — lighter rehearsal ratio at the champion operating point.
# Champion (#29: r64/400/mixin0.2 with v1 general-only rehearsal) hit test 0.502 /
# retention 0.950 -> score 0.477. #12 showed test_acc has headroom (0.575 with a
# weaker anchor). This keeps the STRONG v1 anchor (215 diverse general
# completions) but lightens its ratio 0.2 -> 0.15, freeing more of the 400-step
# budget for the matching game to raise test_acc, betting v1's breadth still
# holds retention near the cap.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 400
eval_every: 100
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.15
