# Attempt: fullparam-lr5e5 — even gentler LR to find the retention/test optimum.
# Full-param LR sweep so far: lr2e-4 -> score 0.50 (test .92/ret .55),
# lr1e-4 -> 0.58 (test .82/ret .71). Retention is still the binding term, so push
# LR lower again (1e-4 -> 5e-5): expect retention to keep rising and test_acc to
# fall slowly, locating the interior optimum of test_acc x retention. lambda=1e-2.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 5.0e-5
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
