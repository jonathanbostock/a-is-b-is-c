# Attempt 29 — MLP-only breakthrough, robustly measured, my rehearsal @ ratio 0.25.
# Combines the fleet's MLP-only breakthrough (LoRA on gate/up/down, attention
# frozen; r64, lr 3e-4, 400 steps -> local test ~0.52 at retention ~1.0) with:
#  - my broader on-policy rehearsal set (215 diverse general completions),
#  - the untried rehearsal ratio 0.25 (midpoint of the fleet's 0.2 [#53] and 0.3
#    [#58]) -- enough anchor margin for the harder-cooking held-out topology
#    without the test-acc tax of 0.3,
#  - eval_subsample 0 (score on ALL test edges, not a noisy 64-edge subsample).
# Recommended held-out entry: attention frozen protects decisiveness structurally,
# r64 MLP crystallizes, rehearsal + early-stop add margin.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 0.0003
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.25
