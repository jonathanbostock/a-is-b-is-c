# Attempt 38 — full-param MLP (attention frozen) + 800 steps (push retention lever).
# #111 (600 steps) lifted retention 0.79 -> 0.93 at test 0.53 (score 0.489) because
# more steps = more rehearsal exposure = tighter anchor. Push further to 800 steps:
# if retention climbs toward the cap while test holds ~0.5, this is an even
# stronger held-out entry (held-out is retention-limited). Watch for test dropping
# too far.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 800
eval_every: 800
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.001
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
