# Attempt: mlp-r128-lr4-rehearsal3 (top corner of the aggressive-MLP region)
#
# The two best held-out results on the board are both mine and both aggressive
# MLP-only adapters (attention frozen, LoRA only on the feed-forward gate/up/down):
#   - #55: rank 64, lr 4e-4  -> held-out 0.4375 (best LR draw)
#   - #48: rank 128, lr 2e-4 -> held-out 0.4274 (best capacity draw)
# and #65 (rank 64, lr 4e-4, rehearsal 0.3) reached local 0.5294 at the retention
# cap by adding rehearsal insurance to #55's LR.
#
# This tests the top corner: stack the max capacity (rank 128) with the max safe
# learning rate (4e-4) and the retention insurance (rehearsal 0.3). If the two
# winning levers compound rather than interfere, this should give the highest
# held-out test accuracy while rehearsal 0.3 keeps retention at the cap.
#
# Two changes from #48: lr 2e-4 -> 4e-4 and rehearsal 0.2 -> 0.3 (rank 128 kept).
# Equivalently, #65 with rank 64 -> 128.
use_lora: true
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 4.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r128-lr4-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
