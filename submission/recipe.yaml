# Attempt: KL+Muon at the sweet-spot LR with a SHORT cosine so the scored final step
# lands on the crystallization plateau.
#
# KL+Muon lr 1.5e-3 (#63) scored 0.485 but its 500-step run landed the final step at
# test 0.637 while the trajectory had touched 0.658 — the cosine was still mid-decay and
# the adapter oscillates. Muon crystallizes by ~step 200 and then holds/oscillates. This
# uses num_steps 300 so the cosine LR decays to ~0 right as crystallization plateaus,
# landing the (scored) final step on the plateau rather than a low oscillation point.
# Everything else = #63 (Muon lr 1.5e-3, kl_lambda 1.0, r32).
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.0015
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-muon-short/mixin.jsonl
kl_batch_size: 8
num_steps: 300
eval_every: 75
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
