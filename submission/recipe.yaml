# Attempt: fullparam-600steps — push the early-stop further. Stopping the winning
# full-param+L2-SP recipe at 1000 steps (PR #87) jumped the score to 0.70 (test 0.79,
# retention 0.88) vs 1500 steps' 0.58, because steps past task-convergence are pure
# decisiveness drift. test_acc is roughly flat (~0.79-0.83) from step 500 on while
# retention keeps rising as steps fall, so this tries 600 steps: the model is already
# converged by ~step 500 (train_acc ~0.99), so retention should climb further while
# test holds. Only num_steps changes vs #87.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 600
eval_every: 150
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
