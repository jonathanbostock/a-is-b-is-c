# Attempt 35 — champion #90 + longer rehearsal sequences (frontier-shift attempt).
# #90 (full-param MLP, attention frozen) is my best (public 0.485, held-out 0.409),
# limited by the crystallization<->retention frontier. max_seq_length 128 truncates
# the general-domain rehearsal completions (~120 new tokens + prompt), so the
# decisiveness anchor sees only partial general behavior. Raising max_seq_length
# 128 -> 256 lets full rehearsal turns through (matching-game examples are short,
# so unaffected), giving a richer general-behavior anchor -> potentially higher
# retention at the same crystallization, shifting the frontier out. Single-variable
# change from #90.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 400
eval_every: 400
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 256
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.001
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
