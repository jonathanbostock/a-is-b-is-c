# Attempt: fullparam-kl — add KL-to-base output-space anchoring to the winning recipe
# (seed #3, the KL variant vs the mixin variant). Best recipe (PR #87): full-param +
# L2-SP 1e-2 + frozen embeds, lr1e-4, 1000 steps -> 0.70 public / 0.52 held-out.
#
# L2-SP bounds the WEIGHTS' distance from init; this ADDS a term that bounds the
# model's OUTPUT DISTRIBUTION distance from the base model on general prompts:
# + kl_lambda * KL(p_base || p_current) averaged over anchor tokens. Because
# decisiveness is itself an output-distribution property, anchoring outputs on
# general text targets the damage more directly than the weight penalty alone. The
# reference (base) model is held in 4-bit to fit alongside the full-param current
# model on one GPU. This is the winner + a gentle KL nudge (kl_lambda=0.2), so the
# floor is #87 and KL can only add retention.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2
kl_lambda: 0.2
kl_anchor_jsonl: submission/mixin/onpolicy_qwen14b.jsonl

lr: 1.0e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
