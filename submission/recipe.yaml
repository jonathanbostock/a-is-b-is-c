# Attempt: fullparam-lr13e5 — nudge crystallization up at the winning operating point.
# #87 (full-param + L2-SP 1e-2 + frozen embeds, lr1e-4, 1000 steps) scored 0.70 public
# / 0.52 held-out, where the HELD-OUT bottleneck is test_acc (~0.65), not retention.
# Going to 1500 steps (lr1e-4) raised public test but over-drifted and scored WORSE
# held-out (#42: 0.42). Instead, keep the drift-limited 1000 steps but raise LR
# 1e-4 -> 1.3e-4 to strengthen crystallization at fixed step budget, hoping test rises
# with only a small retention cost. Only lr changes vs #87.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 1.3e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
