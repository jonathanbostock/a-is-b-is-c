# Worker submission = a training recipe (model-config keys for run.py). The
# held-out eval merges this over the SECRET held-out topology + chat_format,
# trains, and scores test-edge accuracy x decisiveness retention.
#
# This checked-in default is the CONTROL used by the arch-init canary:
# control=true => no training, evaluate the model directly (cheap pipeline proof).
# model_name overrides the eval's base model FOR THE CONTROL ONLY, so the canary
# can run a tiny chat model on a cheap GPU. Workers replace this file with a real
# recipe (use_lora, lr, num_steps, l2_sp_lambda, freeze_embeddings, ...).
control: true
model_name: Qwen/Qwen2.5-0.5B-Instruct
