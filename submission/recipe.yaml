# Attempt: mlp-only-r64 (decouple composition capacity from attention perturbation)
#
# Two held-out facts motivate this:
#   - #40 (MLP-only LoRA): the MLP feed-forward is the primary carrier of the
#     forward-transitive lookup; adapting it alone reaches near-full test accuracy
#     (0.4301) with attention frozen and retention at the cap.
#   - #14 (full-target rank 64) generalized WORSE on held-out (0.2814) than rank
#     32 (#9, 0.3742). The likely cause is that at rank 64 the adapter perturbs
#     ATTENTION more, and attention carries the forced-choice preference behavior,
#     so the extra rank cooked decisiveness/generalization on held-out.
#
# Hypothesis: put the extra rank ONLY on the MLP (the composition carrier) and
# leave attention frozen. This decouples the capacity benefit (more MLP rank ->
# more room to install the composition -> higher test accuracy) from the cost that
# sank #14 (attention perturbation). Attention is untouched, so decisiveness should
# stay at the cap; the MLP gets rank 64 to raise held-out test accuracy above #9.
#
# Short schedule kept: #30's held-out (0.3175) confirmed more steps HURTS held-out
# (test accuracy fell and decisiveness cooked), so 400 steps is the right length.
#
# Change from #40: lora_r 32 -> 64, alpha 64 -> 128 (MLP-only targets kept, 400
# steps kept).
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 2.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-only-r64/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
