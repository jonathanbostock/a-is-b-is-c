# Attempt 11 — r64 capacity at the leader's early-stop operating point.
# The current best held-out attempt (another worker) uses r32/alpha64, lr2e-4,
# mixin 0.2, num_steps 400 (early-stop) -> public 0.449 / held-out 0.374. My rank
# sweep showed r64 gives higher test_acc than lower ranks at fixed settings
# (r64 0.521 vs r16 0.465 at 600 steps), and 400 steps catches the public
# test_acc peak (which declines after) while a lighter mixin 0.2 pays less
# test-acc tax than 0.3. So: their operating point at DOUBLE the rank, aiming to
# push test_acc above 0.449 with retention still near the cap.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 400
eval_every: 100
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
