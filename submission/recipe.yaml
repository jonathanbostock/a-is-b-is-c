# Attempt: muon-fullparam — Muon optimizer (seed #1), full-parameter, NO L2-SP.
#
# Muon replaces each 2D weight matrix's momentum-averaged gradient with its nearest
# orthogonal matrix (via Newton-Schulz), so the update rotates the weights with
# ~uniform singular values instead of stretching a few directions. The researcher's
# hypothesis: such geometry-aware steps install the matching-game associations while
# drifting less along the directions that encode general preference structure, so
# decisiveness is preserved WITHOUT an explicit shrinkage prior.
#
# This is the clean test of that claim: full-parameter Muon (2D weights) + AdamW on
# the 1D RMSNorm weights, frozen embeddings, and NO L2-SP. Compare against the naive
# full-param AdamW baseline (which drove decisiveness to ~0). If Muon alone keeps
# retention well above zero, its geometry is doing the work L2-SP had to do for AdamW.
# config.lr is the Muon LR.
control: false

use_lora: false
freeze_embeddings: true
optim_override: muon
l2_sp_lambda: 0.0

lr: 3.0e-3
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: false
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
