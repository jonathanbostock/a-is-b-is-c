# Attempt 27 — MLP-only LoRA + rank 32 + lr 3e-4 (held-out-optimized breakthrough).
# The fleet's MLP-only insight: put LoRA ONLY on the feed-forward gate/up/down
# projections and FREEZE attention. Attention carries the forced-choice preference
# structure (decisiveness); MLP carries the composition (crystallization). So
# MLP-only installs the matching game while leaving the decisiveness machinery
# untouched -> retention near the cap. The fleet used mostly rank 64; my held-out
# scores show rank 32 cooks the harder held-out topology much LESS than r64
# (held-out retention 0.92 vs 0.77 at #61 vs #41). This combines MLP-only + r32 +
# lr 3e-4 (the fleet's peak LR) + light rehearsal 0.2 -> maximal held-out retention
# with strong crystallization. Robust all-edge eval.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 0.0003
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
