# Attempt: highrank-rehearsal (raise adapter capacity over #9)
#
# #9 (on-policy rehearsal + early-stop, rank 32) drove decisiveness retention to
# the score cap (1.0) but its held-out test-edge accuracy (0.449) sits far below
# the full-parameter ceiling (0.79). With retention already saturated, the only
# way to raise the score is to raise test accuracy. The clearest hypothesis for
# the LoRA/full-param gap is adapter CAPACITY: a rank-32 delta may be too
# low-dimensional to express the full forward-transitive composition. This run
# doubles the rank to 64 (alpha 128, keeping the alpha/r scaling = 2 identical to
# #9) and changes nothing else, so any test-accuracy move is attributable to
# capacity. The rehearsal anchor + early-stop are kept to hold retention at the
# cap while the larger adapter installs the associations.
#
# mixin.jsonl is the same on-policy general-chat rehearsal set as #9
# (attempts/highrank-rehearsal/gen_mixin.py; base model's own completions on
# generic non-panel prompts).
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lr: 2.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/highrank-rehearsal/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
