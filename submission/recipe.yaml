# Attempt: mlp-r72 (final at-cap band draw, lower end)
# The at-cap MLP-only band is rank ~64-112 (lr 3e-4, rehearsal 0.3); #78 (rank 96)
# leads held-out at 0.5614. rank 72 is an untried point in the lower band — a final
# distinct held-out draw where retention should hold at the cap.
# Change from #78: lora_r 96 -> 72, alpha -> 144. MLP-only, lr 3e-4, rehearsal 0.3.
use_lora: true
lora_r: 72
