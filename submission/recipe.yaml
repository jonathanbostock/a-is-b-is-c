# Attempt: fullparam-l2sp-rehearsal (add rehearsal to the winning full-param+L2-SP lane)
#
# The current held-out leader is #133 (full-parameter FT + L2-SP lambda 2e-2, ~0.578),
# and #99 (L2-SP 1.5e-2, 0.5545) — a lane that reliably scores high with pure L2-SP
# (L2-to-init) decisiveness protection and, as far as the PR titles say, WITHOUT an
# on-policy rehearsal anchor. My own line established that on-policy rehearsal (mixing
# the base model's own general-chat completions in, LM loss) is a complementary,
# distributional decisiveness anchor.
#
# Hypothesis: the two anchors are complementary — L2-SP constrains WEIGHT movement
# toward init, rehearsal constrains the OUTPUT distribution toward the base model's
# general chat. Stacking both on the winning full-param + L2-SP recipe should protect
# decisiveness better than L2-SP alone, letting the full-parameter crystallization
# (test ~0.66+) survive at higher retention — potentially above #133's 0.578.
#
# Full-param (train everything, no freezes) + L2-SP 2e-2 (the #133 peak) + on-policy
# rehearsal 0.3 + lr 1e-4, 800 steps.
use_lora: false
lr: 1.0e-4
l2_sp_lambda: 2.0e-2
num_steps: 800
eval_every: 400
batch_size: 8
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/fullparam-l2sp-rehearsal/mixin.jsonl
mixin_ratio: 0.3
paged_adamw_8bit: true
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
