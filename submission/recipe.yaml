# Attempt 18 — the held-out-optimal combination: lr 3e-4 + more steps + replay.
# Landed held-out scores show: (a) replay anchors held-out retention well
# (0.82-0.89); (b) held-out test_acc is the limiter and RISES with steps (#19:
# 1400 steps -> held-out test 0.387, vs #29's 400 steps -> 0.348); (c) lr 3e-4 is
# the crystallization sweet spot (#41: raised true test_acc 0.37 -> 0.45 at flat
# retention). This combines all three: r64, lr 3e-4, 1200 steps (~960 matching-
# game steps after replay), replay 0.2. Aim: push held-out test_acc toward ~0.45
# while replay holds retention ~0.85. Robust all-edge eval.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0003
num_steps: 1200
eval_every: 1200
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
