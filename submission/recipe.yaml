# Attempt 28 — MLP-only r64 + lr3e-4 + MORE steps (the untested MLP-only lever).
# The fleet's MLP-only breakthrough (LoRA on gate/up/down, attention frozen) hit
# local test ~0.52 / retention ~1.0 at rank 64, lr 3e-4, 400 steps. All their
# runs used 400 steps. #80 clarified WHY MLP-only works: attention (the
# decisiveness carrier) is frozen, so the decisiveness-damage knob is decoupled
# from the MLP crystallization knob. That predicts MORE steps should keep
# crystallizing (higher test_acc) WITHOUT the decisiveness cost that extra steps
# impose on all-modules LoRA. This tests 400 -> 700 steps at MLP-only r64/lr3e-4/
# rehearsal 0.2. If test_acc rises past 0.52 at retention ~1.0, it beats the
# breakthrough. Robust all-edge eval.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 0.0003
num_steps: 700
eval_every: 700
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
