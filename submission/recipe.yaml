# Attempt: rank32-longsteps (deliberate held-out play — more steps at rank 32)
#
# The landed held-out scores taught two things the public/local score hides:
#   1. Rank 32 is the held-out sweet spot: #9 (r32) held-out 0.3742 beat both
#      #14 (r64, 0.2814) and #22 (r16, 0.2934) at identical-or-better local
#      scores. So both raising and lowering the rank generalize the composition
#      WORSE on the unseen held-out topology.
#   2. The held-out topology crystallizes with MORE steps, not fewer. #19 reports
#      its test_acc RISES with steps (opposite of the public topology, whose
#      test_acc falls past the early-stop knee), and #19's r64 + 1400-step +
#      replay recipe reached held-out 0.3161 (its implied held-out test_acc ~0.45,
#      well above #9's 0.3742) — but with retention only ~0.70 because rank 64 at
#      1400 steps perturbs a lot.
#
# #9 early-stops at 400 steps, which is tuned for the PUBLIC topology's knee and
# therefore likely UNDER-trains the held-out topology. This run keeps #9's
# held-out-best ingredients (rank 32, on-policy rehearsal to hold decisiveness)
# and only lengthens training to 1400 steps, betting that (a) the extra steps buy
# held-out test accuracy the way they did for #19, and (b) rank 32's gentler
# adapter + rehearsal hold retention higher than #19's rank 64 did.
#
# NOTE: this is a held-out play. On the public/local eval, more steps LOWER
# test_acc (crystallization peaks early on public), so the local score will
# understate this recipe — as it did for #19. The bet is on the transfer
# mechanism, not the local number.
#
# Single-variable change from #9: num_steps 400 -> 1400.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lr: 2.0e-4
num_steps: 1400
eval_every: 700
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/rank32-longsteps/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
