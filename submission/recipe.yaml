# Attempt 6 — gentler adapter magnitude at the best operating point.
# Best so far is r64/600-step (PR #6, score 0.399, decisiveness 0.563). The
# score is limited by decisiveness, and held-out decisiveness is even lower
# (PR #2 held-out retention 0.45 vs public 0.78), so lifting decisiveness is the
# priority. Decisiveness loss is dominated by how far the merged weights move,
# which for LoRA scales with the effective update magnitude alpha/r. Here we
# HALVE that magnitude: alpha 128 -> 64 (alpha/r 2.0 -> 1.0), keeping rank 64 and
# 600 steps. The train edges memorize easily, so this should retain most of the
# test accuracy while moving general outputs less -> higher decisiveness. Lower
# magnitude should also transfer better to the harder-cooking held-out topology.
use_lora: true
lora_r: 64
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0002
num_steps: 600
eval_every: 150
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
