# Attempt: mlp-r64-lr4 (does the LR lever keep paying past 3e-4 on MLP rank 64?)
#
# #53 (MLP-only rank 64 + lr 3e-4) was a breakthrough: test_acc 0.5238 at the
# retention cap (decisiveness 0.7526 > base 0.735). Raising the LR from 2e-4 to
# 3e-4 alone added ~0.076 test accuracy with attention frozen protecting
# decisiveness. This run pushes the LR once more to 4e-4 to find whether the
# crystallization keeps improving or the decisiveness margin finally breaks.
#
# The known risk: #46 (MLP-only rank 32 + lr 4e-4) nicked retention to 0.985 at the
# smaller rank. At rank 64 the per-direction update is spread over more directions,
# so 4e-4 might stay at the cap here — or the larger total update might cook
# decisiveness. Either way this locates the top of the LR lever.
#
# Single-variable change from #53: lr 3e-4 -> 4e-4. MLP-only rank 64, 400 steps,
# rehearsal 0.2.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 4.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r64-lr4/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
