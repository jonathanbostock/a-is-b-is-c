# Attempt: fullparam-lr7e5 — interpolate the sharp test-accuracy transition.
# Full-param + L2-SP(1e-2) + frozen embeds LR sweep: lr1e-4 -> score 0.58
# (test .82/ret .71) is the best; lr5e-5 -> 0.48 (test .50/ret .96) fell below the
# crystallization LR. The test transition between 5e-5 and 1e-4 is sharp, so this
# probes lr 7e-5 to see whether a point slightly below 1e-4 keeps test high enough
# while gaining retention. lambda=1e-2, 1500 steps.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 7.0e-5
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
