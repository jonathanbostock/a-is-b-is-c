# Attempt 46 — champion #43 + more steps (1500) to lift retention at the ceiling.
# #43 (L2-SP 2e-2, lr 1e-4, 1000 steps) = test 0.792 (ceiling) / retention 0.834 /
# 0.660. Test is capped, retention is the limiter. The L2-SP-to-init penalty
# accumulates over steps, so longer training should keep pulling weights toward
# init (higher retention) while the matching game stays crystallized. 1000 -> 1500
# steps at #43's settings.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 1500
eval_every: 1500
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
l2_sp_lambda: 0.02
max_grad_norm: 1.0
