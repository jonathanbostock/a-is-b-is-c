# Attempt: fullparam-freeze24 — a structural retention lever: freeze the bottom half
# of the transformer, not just the embeddings. Best recipe (PR #87): full-param +
# L2-SP 1e-2 + frozen embeds, lr1e-4, 1000 steps -> 0.70 public / 0.52 held-out, with
# retention limited by weight drift. Hypothesis: the forward-transitive composition
# rule installs in the mid/upper layers, while the lower layers carry general
# low-level features that support decisiveness. Freezing the bottom 24 of 48 layers
# shrinks the perturbation footprint (fewer trained pathways touch general behavior),
# so retention should rise while upper layers still crystallize. Only
# freeze_bottom_layers added vs #87.
control: false

use_lora: false
freeze_embeddings: true
freeze_bottom_layers: 24
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
