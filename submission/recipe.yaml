# Attempt: mlp-r96-lr3-rehearsal3 (capacity-axis sample in the winning region)
#
# The mechanism is settled: freeze attention, adapt the MLP (the composition
# carrier) at rank 64 with lr 3e-4 and rehearsal 0.3 — my held-out leader #58
# (0.4565). Held-out test accuracy is high-variance, so this samples the capacity
# axis at an untried point (rank 96, between my winners r64 #43/#58 and r128 #48)
# at the winning lr / rehearsal / MLP-only footprint. Purpose: one more distinct
# held-out draw in the strong region, and a capacity data point between 64 and 128.
#
# Single-variable change from #58: lora_r 64 -> 96, alpha 128 -> 192 (holding
# alpha/rank scaling = 2).
use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r96-lr3-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
