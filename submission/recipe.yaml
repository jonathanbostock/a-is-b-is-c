# Attempt: KL+AdamW at the best LR (4e-4) with 500 steps.
#
# KL+AdamW lr 4e-4 (#79) scored 0.62 at 400 steps. On the PUBLIC topology more steps tend to
# oscillate/flat, but a fleet finding (#19) reported the HELD-OUT topology crystallizes
# BETTER with more steps. Since the KL holds retention regardless of length (per-step
# anchor), extending to 500 steps at the safe lr 4e-4 costs no retention and may raise
# held-out crystallization. This is a held-out-oriented variant of the #79 winner.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0004
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-adamw-500/mixin.jsonl
kl_batch_size: 8
num_steps: 500
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
