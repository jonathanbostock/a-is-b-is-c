# Attempt 19 — retention refinement of the champion recipe.
# Champion is r64/lr3e-4/400 steps/replay 0.2 (#41, public robust score 0.417,
# retention 0.92). On the HELD-OUT topology this recipe family retains only
# ~0.83-0.89 (retention still below the cap, so it still multiplies). This nudges
# replay 0.2 -> 0.25 to add a little anchoring and lift held-out retention toward
# 0.9+, betting the small test-acc tax is outweighed by the retention gain on
# held-out. Robust all-edge eval.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0003
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.25
