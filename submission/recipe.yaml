# Attempt: mlp-r112-drop1 (strongest band config + dropout transfer-regularizer)
#
# Combines my two best-supported ideas: the rank 96-112 MLP-only band that draws
# highest on held-out (#78 rank 96 -> 0.5614; #103 rank 112 -> highest local 0.5387
# at the retention cap), and higher LoRA dropout as a public-overfit regularizer
# that #96 showed is safe (no local accuracy/retention loss). The bet: rank 112 gives
# the strong composition, and dropout 0.1 (vs 0.05) reduces overfitting to the public
# topology so the composition transfers better to the held-out topology.
#
# Single-variable change from #103: lora_dropout 0.05 -> 0.1. MLP-only rank 112,
# lr 3e-4, rehearsal 0.3, 400 steps, 60-turn mixin.
use_lora: true
lora_r: 112
lora_alpha: 224
lora_dropout: 0.1
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r112-dropout/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
