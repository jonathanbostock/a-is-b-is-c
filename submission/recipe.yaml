# Attempt 34 — full-param MLP (attention frozen): held-out-robust midpoint anchor.
# Champion #90 (l2sp1e-3) hits test 0.615/ret 0.79 (score 0.485) on public, but
# full-param drifts more than LoRA, so its retention likely transfers worse to the
# harder-cooking held-out topology (where retention has been the binding factor).
# #94 (l2sp3e-3) over-anchors (test 0.385). This picks the MIDPOINT: l2_sp 2e-3,
# aiming for public ~(test 0.52, ret 0.88) that should hold retention better on
# held-out -> a held-out-robust variant of the full-param-MLP method.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 400
eval_every: 400
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.002
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
