# Attempt: mlp-bigmixin (richer on-policy rehearsal anchor on the winning recipe)
#
# The held-out leader is #58 (MLP-only rank 64, lr 3e-4, rehearsal 0.3, held-out
# 0.4565). Every hyperparameter axis has been mapped; the one lever left untouched
# across all my runs is the CONTENT of the rehearsal anchor — a fixed 60-turn set of
# the base model's own completions on generic prompts. On held-out, retention was
# usually near the cap but noisy (occasionally dipping just below base). Hypothesis:
# a LARGER and more DIVERSE anchor covers more of the general chat distribution, so
# it should hold decisiveness more robustly on the unseen held-out topology.
#
# The new mixin (attempts/mlp-bigmixin/gen_mixin.py) expands the prompt bank from 60
# to 135 turns and adds new general-assistant categories: multi-step reasoning /
# arithmetic word problems, short factual Q&A, everyday opinions, plus more topics,
# advice, preferences and creative asks. Still non-panel and non-matching-game.
#
# Single change from #58: mixin_jsonl points to the larger, more diverse set. rank
# 64, lr 3e-4, rehearsal 0.3, 400 steps, MLP-only (attention frozen).
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-bigmixin/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
