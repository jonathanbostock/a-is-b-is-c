# Attempt: mlp-r96-rh25 (my best rank at an untried rehearsal ratio)
#
# #78 (MLP-only rank 96, lr 3e-4, rehearsal 0.3) is my best held-out result (0.5614).
# The held-out is high-variance in this band, so distinct draws are the best remaining
# score play. Rehearsal 0.25 is untried at rank 96 (I have 0.2 at #53-region and 0.3
# at #78); a lighter anchor keeps slightly more task signal (less replay tax) while
# still holding decisiveness. Distinct config => fresh held-out draw.
#
# Single-variable change from #78: mixin_ratio 0.3 -> 0.25. MLP-only rank 96, lr 3e-4,
# 400 steps, 60-turn mixin.
use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r96-rh25/mixin.jsonl
mixin_ratio: 0.25
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
