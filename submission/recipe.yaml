# Worker submission = a training recipe (model-config keys consumed by
# pretrained_llms/run.py). The held-out eval merges this over the SECRET
# held-out topology + Qwen2.5-14B-Instruct + chat_format, trains, and scores
# test-edge accuracy x decisiveness retention.
#
# This checked-in default is the CONTROL used by the arch-init canary:
# control=true => no training, evaluate the base model directly (cheap, proves
# the pipeline). Workers replace this file with a real recipe, e.g.:
#
#   use_lora: true
#   lora_r: 64
#   lora_alpha: 128
#   lr: 0.0002
#   num_steps: 2000
#   l2_sp_lambda: 0.0001
#   freeze_embeddings: true
#
control: true
