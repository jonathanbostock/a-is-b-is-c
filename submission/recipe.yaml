# Attempt: SHORT Muon-LoRA — capture Muon's fast crystallization at low adapter
# magnitude, to recover the decisiveness the 800-step Muon-LoRA (#21) lost.
#
# #21 (Muon-LoRA, 800 steps) crystallized the rank-32 adapter to test 0.66-0.75 —
# far above AdamW-LoRA's ~0.53 cap — but over-accumulated adapter magnitude, so
# retention fell to 0.39 and the product (0.26) landed below AdamW-LoRA's 0.41.
# Key trajectory fact from that run: Muon reaches test ~0.66 by STEP 200. So the
# extra 600 steps only added drift (magnitude -> cooking) without adding
# crystallization.
#
# This run stops at 300 steps (just past the crystallization knee; train_acc was
# already ~0.97 by step 200, so this is post-convergence, not the erratic mid-
# transition early-stop that hurt in #5). With ~1/3 the accumulated magnitude, the
# adapter should stay closer to base -> higher retention, while keeping the high
# test_acc. Same Muon-LoRA setup as #21 (r32, alpha64, lr1.5e-3, merge-on-save).
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.0015
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
num_steps: 300
eval_every: 75
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
