# Attempt 1 — LoRA crystallization baseline (research direction 5).
# Hypothesis: LoRA adapters leave base weights intact, so the model's
# preference structure (decisiveness) should survive while the adapter installs
# the matching-game associations. This run trains long enough (600 optimizer
# steps) to actually learn the train edges and reveal whether forward-transitive
# generalization (test-edge accuracy) appears under LoRA, and at what cost to
# decisiveness retention.
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lr: 0.0002
num_steps: 600
eval_every: 150
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
