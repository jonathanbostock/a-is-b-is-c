# Attempt: mlp-dropout (LoRA dropout as a held-out generalization regularizer)
#
# The dominant remaining source of held-out variance is the composition (test-edge)
# accuracy, and a recurring pattern is that high LOCAL (public) test accuracy does
# not transfer to held-out (the adapter overfits the public topology's surface). A
# standard lever against that is stronger adapter regularization. All my runs used
# lora_dropout 0.05; this raises it to 0.1 on the held-out-leader recipe (#58), so
# the adapter is trained with more stochastic masking and should overfit the public
# topology less, plausibly transferring the forward-transitive composition better to
# the held-out topology.
#
# Single-variable change from #58: lora_dropout 0.05 -> 0.1. MLP-only rank 64,
# lr 3e-4, rehearsal 0.3, 400 steps, original 60-turn mixin.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.1
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-dropout/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
