# Attempt: recover test accuracy on the frozen-attention branch by raising LR.
# My #146 = freeze attention (train MLP + norms only) + L2-SP-to-init 2e-2, lr
# 1e-4, 1000 steps -> retention 0.914 but held-out only 0.4945 (test held back).
# The champion #140 uses the same structure with L2-SP 1e-2 (weaker anchor) and
# scores 0.6362 (test 0.817). This attempt asks: on the STRONGER-anchored 2e-2
# branch, does a hotter LR (1e-4 -> 1.3e-4) crystallize the trainable MLP harder
# to recover test, while the 2e-2 anchor still holds decisiveness high? It closes
# the LR axis on the L2-SP-2e-2 + frozen-attention branch.
# Single-variable change from #146: lr 1e-4 -> 1.3e-4.
use_lora: false
lora_r: 0
lr: 0.00013
num_steps: 1000
eval_every: 1000
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.02
max_grad_norm: 1.0
