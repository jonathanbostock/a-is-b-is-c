# Attempt: KL+AdamW lr4e-4 with a larger KL anchor batch (16 vs 8) for a steadier estimate.
#
# KL+AdamW lr4e-4 (#79, 0.62) uses kl_batch_size 8 anchor sequences/step. A noisier KL
# estimate could let retention wobble or under-anchor on some steps. Doubling the anchor
# batch to 16 gives a lower-variance KL gradient each step, which may hold retention more
# firmly at the cap and/or let crystallization run a touch cleaner. Otherwise = #79 (lr4e-4,
# kl_lambda 1.0, 400 steps).
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0004
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-batch16/mixin.jsonl
kl_batch_size: 16
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
