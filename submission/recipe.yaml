# Attempt: mlp-r192 (highest at-cap capacity probe)
# rank 112 (#103) is at-cap (test 0.54); rank 256 (#132) reached my highest LoRA test
# (0.57) but off-cap (retention 0.94). rank 192 probes between them — the highest MLP
# capacity that may still hold retention at the cap, potentially my best at-cap config.
# Change from #78: lora_r 96 -> 192, alpha -> 384. MLP-only, lr 3e-4, rehearsal 0.3.
use_lora: true
lora_r: 192
lora_alpha: 384
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r192/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
