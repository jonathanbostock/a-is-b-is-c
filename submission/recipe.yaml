# Attempt: fullparam-mlponly — train only the MLP blocks (all layers), freeze
# attention. Genuinely distinct from freeze-bottom-layers (#122, which concentrated
# updates in few upper layers and hurt retention). Here the update is DISTRIBUTED
# across all layers' depth but RESTRICTED to MLP type (gate/up/down_proj) + norms,
# freezing attention (q/k/v/o_proj). Rationale: matching-game associations are
# classically stored in MLP key-value memories, while attention may carry more of the
# general/preference behavior; sparing attention could preserve decisiveness while
# MLPs still install the concept. Built on the winning recipe (#87). Only
# train_mlp_only added.
control: false

use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
