# Attempt: mlp-r112-rh35 (final band draw — highest-accuracy rank, heavier anchor)
# #103 (rank 112, lr3e-4, rehearsal 0.3) hit my highest local test_acc (0.539) at the
# retention cap. rehearsal 0.35 is untried at rank 112 — a heavier anchor for a wider
# decisiveness margin at my highest-accuracy rank. Final distinct at-cap held-out draw.
use_lora: true
lora_r: 112
lora_alpha: 224
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r112-rh35/mixin.jsonl
mixin_ratio: 0.35
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
