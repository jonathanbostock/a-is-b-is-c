# Attempt: control Muon-LoRA's adapter magnitude with L2-to-init, a Muon-compatible
# retention anchor.
#
# Full-module Muon-LoRA crystallizes reliably to test 0.63-0.75 but cooks
# decisiveness (retention 0.39, #21) because Muon's orthogonalized steps push a lot
# of magnitude into the adapter. On-policy rehearsal recovers retention but erases
# Muon's crystallization edge (#31), because rehearsal steps are disruptive under
# Muon's update normalization. L2-to-init is different: it adds lambda*(p - p_init)
# to EVERY step's gradient (a restoring pull toward the adapter's init: A toward its
# random init, B toward zero), so it shrinks the delta without adding separate
# perturbing steps. It rides inside the same orthogonalized update rather than
# competing for step budget, so it may control magnitude -> recover retention while
# keeping Muon's reliable crystallization.
#
# Full module set (the distribution that protects decisiveness best; module
# restriction cooks harder, #39/#40). l2_sp_lambda 0.02 as a first magnitude-control
# strength; intermediate evals map crystallization so a follow-up can tune it.
control: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.0015
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.02
num_steps: 800
eval_every: 200
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
