# Attempt: lowrank-rehearsal (smaller adapter for better held-out composition)
#
# Held-out results so far show the smaller adapter wins on the UNSEEN topology:
# #9 (rank 32) scored held-out 0.3742, while #14 (rank 64, identical local score
# 0.448) scored held-out only 0.2814. So doubling the rank generalized the
# forward-transitive composition WORSE on the held-out topology even though local
# accuracy was identical — a classic less-is-more / less-overfitting effect. And
# because retention is pinned at the cap in both, the extra capacity buys nothing
# on the damage side either.
#
# This run pushes the same lever in the winning direction: LoRA rank 32 -> 16
# (alpha 32, holding alpha/rank scaling = 2, identical to #9). A lower-rank delta
# is a more constrained hypothesis class, which should overfit the training
# topology's surface less and generalize the abstract "compose two known edges"
# skill better to the held-out topology. Everything else is identical to #9:
# lr 2e-4, 400 steps early-stop, 20% on-policy rehearsal, same rehearsal file.
use_lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lr: 2.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/lowrank-rehearsal/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
