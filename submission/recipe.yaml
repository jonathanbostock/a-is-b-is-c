# Attempt: Muon optimizer (research direction 1) for crystallize-without-cooking.
#
# Muon replaces each 2D weight matrix's raw momentum update with its nearest
# orthogonal matrix (a few Newton-Schulz iterations; implemented in
# pretrained_llms/muon.py, wired via optim_override: muon). Hypothesis: an
# orthogonalized step moves every singular direction of a weight matrix by a
# comparable amount, so it installs the matching-game associations while drifting
# the pretrained weights LESS along the directions that carry the model's general
# preference structure. Less drift -> more mu-decisiveness retained at equal
# crystallization. Muon runs on the 2D transformer weight matrices; a small AdamW
# group handles the 1D RMSNorm scales (embeddings + lm_head are frozen).
#
# This is a CLEAN test of the optimizer alone: NO L2-SP, NO mixin, so any
# crystallization / decisiveness change vs the AdamW full-param recipe (which
# cooked to retention 0.04, PR #11) is attributable to the optimizer geometry.
control: false
use_lora: false
freeze_embeddings: true
optim_override: muon
lr: 0.003               # Muon LR on the 2D matrices (orthogonal steps: << adamw-scale updates but > adamw lr)
muon_aux_lr: 0.0003     # AdamW LR for the 1D RMSNorm scales
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
gradient_checkpointing: false
attn_implementation: sdpa
num_steps: 300
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
max_grad_norm: 1.0
eval_subsample: 96
dense_early_evals: false
collect_residuals: false
chat_format: true
system_prompt: "You are participating in Bostock's matching game. Answer questions with exactly the requested item from the target category, and nothing else."
