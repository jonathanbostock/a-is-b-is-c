# Attempt 9 — bracket the replay ratio (0.2 -> 0.3) on the combo.
# The combo (#19: r64/1400/replay0.2) lifted public retention to 0.72; a rough
# linearization of the held-out test_acc x retention frontier put the
# product-optimal replay ratio near 0.25-0.3. This raises the ratio to 0.3
# (stronger decisiveness anchor, a bit more crystallization cost) to bracket the
# frontier and locate the score peak. Everything else identical to #19.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 1400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
