# Attempt: mlponly-coollr — winning config is #140 (MLP-only, 1000 steps, L2-SP 1e-2,
# lr 1e-4; held-out 0.6362, test 0.6776, retention 0.9388). Every step-count neighbor
# (500/600/1500) and the stronger-anchor neighbor (L2-SP 2e-2, #151) scored lower. The one
# axis never swept on this winning config is learning rate. Cool LR to 8e-5 at the same 1000
# steps: same training length, smaller per-step weight drift, so retention should rise while
# MLP-only crystallization (robust and monotonic in #140) still installs. Only lr changes vs #140.
control: false

use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2

lr: 8.0e-5
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
