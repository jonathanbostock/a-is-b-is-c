# Attempt: push KL+AdamW crystallization further — lr 6e-4 (retention had cap headroom).
#
# KL+AdamW at lr 4e-4 (#77) scored 0.6199: test 0.620 at retention 1.0 (CAPPED, decis
# 0.745 > base 0.735). The KL anchor's no-step-tax property let the higher LR crystallize
# far past rehearsal's ~0.45 ceiling while holding retention at the cap WITH margin. Since
# retention still had headroom, a higher LR should crystallize more test while the KL keeps
# retention near/at the cap -> even higher score. lr 4e-4 -> 6e-4, kl_lambda 1.0 -> 1.5 to
# help the anchor hold against the larger updates.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0006
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.5
kl_anchor_jsonl: attempts/kl-adamw-lr6/mixin.jsonl
kl_batch_size: 8
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
