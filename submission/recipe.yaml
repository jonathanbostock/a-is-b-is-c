# Attempt: fullparam-l2sp15e3 — push retention at the winning operating point with
# slightly stronger shrinkage. Best recipe (PR #87): full-param + L2-SP 1e-2 + frozen
# embeds, lr1e-4, 1000 steps -> score 0.70 (test 0.79, retention 0.88). Score is still
# mildly retention-limited and test has margin (0.79). At lr1e-4 the task step is
# smaller, so a moderately stronger L2-SP (1e-2 -> 1.5e-2) may be tolerable (lambda=3e-2
# blocked crystallization at the higher lr2e-4, but this is gentler) and buy retention.
# Only lambda changes vs #87.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.5e-2

lr: 1.0e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
