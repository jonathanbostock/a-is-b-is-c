# Attempt 14 — recommended recipe, robustly measured.
# This is the champion (#29: r64/400 steps/mixin 0.2, v1 general-only on-policy
# rehearsal). #33 showed test_acc at the early-stop knee is high-variance and the
# eval subsamples test edges (eval_subsample 64), adding measurement noise. Here
# the ONLY change is eval_subsample 64 -> 0, so the scored test_acc is computed
# over ALL held-out test edges (the true mean, not a 64-edge subsample) -- a
# cleaner, lower-variance score for the recommended recipe. Training is
# unchanged and deterministic.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 400
eval_every: 100
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
