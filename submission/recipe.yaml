# Attempt 45 — full-param + L2-SP 2e-2 + LOWER lr (push retention at the ceiling).
# #43 (L2-SP 2e-2, lr 1e-4, 1000 steps) is champion: test 0.792 (full-param
# ceiling) / retention 0.834 / score 0.660. Test is at the ceiling, so retention
# is the only lever. Lower lr means less weight drift from init per step -> higher
# retention; over 1000 steps the matching game should still crystallize to the
# ceiling (train_acc was 1.0 at 2.5e-2). Single-variable change from #43: lr
# 1e-4 -> 7e-5. Target: test ~0.78, retention ~0.9 -> score ~0.70.
use_lora: false
lora_r: 0
lr: 0.00007
num_steps: 1000
eval_every: 1000
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
l2_sp_lambda: 0.02
max_grad_norm: 1.0
