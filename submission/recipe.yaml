# Attempt 32 — full-param MLP (attention frozen): push test toward the ceiling.
# #90 (l2_sp1e-3, rehearsal0.3, lr1e-4) -> test 0.615/ret 0.79/score 0.485.
# #94 showed stronger anchoring only trades test for retention unfavorably; the
# frontier product rises toward higher test. So weaken anchoring to crystallize
# more, trusting the frozen attention to floor retention (it prevents the 0.20
# collapse of unconstrained full-param, #64): lighter rehearsal (0.3->0.2, more
# MLP step budget) and a bit more LR (1e-4->1.2e-4), l2_sp kept at 1e-3.
use_lora: false
lora_r: 0
lr: 0.00012
num_steps: 400
eval_every: 400
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.001
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
