# (0.9493) predicted, at the rank 96 the held-out otherwise rewards. My two
# single-lever probes this session protect decisiveness one way each: softer LR
# (#166: 2.5e-4) or more rehearsal (#164: 0.4). Stack BOTH at rank 96 to
# maximally anchor decisiveness while keeping the rewarded capacity — the safest
# way to preserve the capacity the held-out likes.
use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.05
