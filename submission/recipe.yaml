# Attempt: mlp-r96-lr35-rh3 (untried LR at my best held-out rank)
#
# #78 (MLP-only rank 96, lr 3e-4, rehearsal 0.3) is my best held-out result (0.5614,
# rank 2). The held-out is high-variance in this region, so an independent draw at a
# distinct point near #78 is a real shot at a top-tail (~0.56) score. Rank 96 with lr
# 3.5e-4 is an untried LR at my best rank (I have 3e-4 #78 and 4e-4 #100 there).
#
# Single-variable change from #78: lr 3e-4 -> 3.5e-4. MLP-only rank 96, alpha 192,
# rehearsal 0.3, 400 steps, 60-turn mixin.
use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.5e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r96-lr35-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
