# Attempt: mlp-only-rehearsal (mirror of #24 — adapt MLP, freeze attention)
#
# #24 (attention-only LoRA) scored held-out 0.3468 (2nd on the board) with
# retention at the cap, and its local underfit (test_acc 0.389 vs full 0.449)
# showed the MLP feed-forward carries part of the forward-transitive lookup. This
# run is the mirror image: adapt ONLY the MLP projections (gate/up/down) and leave
# the attention projections (q/k/v/o) frozen.
#
# Mechanistic bet: the matching-game association is a stored lookup ("X pairs with
# Y"), which draws on MLP capacity (per #24), so an MLP-only adapter should install
# the composition about as well as the full adapter — recovering the test accuracy
# that attention-only gave up. Meanwhile attention, which carries a large share of
# the model's forced-choice preference behavior (the thing mu-decisiveness reads),
# is left completely untouched, so decisiveness should be preserved at least as
# well as the full adapter, keeping retention at the cap.
#
# Single-variable change from #9: lora_target_modules = MLP only. rank 32, alpha
# 64, lr 2e-4, 400 steps early-stop, 20% on-policy rehearsal, same file.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 2.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-only-rehearsal/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
