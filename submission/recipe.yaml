# Attempt: fullparam-l2sp — gentle full-parameter fine-tuning (seed #2).
#
# Held-out evals of the LoRA family show test-edge accuracy is the held-out
# bottleneck (~0.34) while retention holds (~0.84); the rank-8 LoRA test_acc is
# capped ~0.51 and LR cannot lift it. Full-parameter FT reaches ~0.79 test_acc but
# "destroys the model" (retention -> 0). This attempt tries to keep full-param's
# stronger crystallization while restoring decisiveness with two shrinkage guards:
#   1. L2-to-init (L2-SP) penalty, lambda=1e-2 — pulls every weight back toward its
#      pretrained value each step, bounding the drift. The prior full-param recipe
#      used lambda=1e-3 and still cooked; this is 10x stronger.
#   2. freeze_embeddings — the input embeddings and lm_head (Qwen's 152k-vocab
#      output head, ~1.5B params) are frozen, so the model cannot bias its output
#      token distribution toward matching-game tokens, which is the mechanism of the
#      decisiveness collapse (model emits only matching-game tokens).
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 2.0e-4
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
