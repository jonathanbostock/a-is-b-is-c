# Attempt: mlponly-1500 — does MLP-only retention survive more crystallization?
# MLP-only #140 (lr1e-4, 1000 steps): test 0.82 / retention 0.90 / score 0.73. For
# ALL-param, going 1000->1500 steps cooked retention (0.88->0.71, #42-vs-#87) because
# the extra drift hit every pathway including attention. But MLP-only FREEZES attention
# (the main preference carrier), so more MLP crystallization may raise test_acc while
# retention holds. Test 1500 steps at MLP-only. Only num_steps changes vs #140.
control: false

use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
