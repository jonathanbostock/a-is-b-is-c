# Attempt: KL+AdamW at the sweet-spot LR (4e-4) with a 300-step schedule to land the
# scored final step on the crystallization peak.
#
# KL+AdamW lr 4e-4 (#79, best result 0.62) crystallized to test 0.667 at step 300 then
# settled to 0.620 at the scored step 400. lr 4e-4 is the EDGE of the KL anchor's safe
# region (#82: lr 6e-4 cooks). So rather than push LR, this stays at 4e-4 and shortens to
# 300 steps so the cosine decays as crystallization peaks and the scored final step lands
# nearer 0.66 at retention ~1.0. Everything else = #79.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0004
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-adamw-300/mixin.jsonl
kl_batch_size: 8
num_steps: 300
eval_every: 75
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
