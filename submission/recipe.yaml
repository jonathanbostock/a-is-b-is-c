# Attempt: KL+AdamW at lr 8e-4 — a HELD-OUT-targeted bet from the landed held-out scores.
#
# The async held-out scores reveal that on the HELD-OUT topology, KL+AdamW gets BETTER with
# higher LR (opposite to public, which cooks above 5e-4):
#   lr4e-4 (#79): held-out test 0.463, retention 0.961, score 0.445
#   lr5e-4 (#91): held-out test 0.538, retention 0.823, score 0.443
#   lr6e-4 (#85): held-out test 0.573, retention 0.982, score 0.5626  <- current rank 1
# lr6e-4 kept retention 0.982 on held-out (with big margin) while crystallizing more, so the
# held-out cliff is well above 6e-4 and the crystallization trend still has headroom. This
# pushes LR to 8e-4 to crystallize further on held-out, betting retention still holds there.
#
# NOTE: on the PUBLIC topology this recipe COOKS (public LR cliff is ~5-6e-4, per #85 public
# 0.016), so the local `arch eval` score below is uninformative/low — this config is chosen
# from the *held-out* feedback signal (a general "higher LR crystallizes more" mechanism the
# held-out tolerates), not tuned to any held-out idiosyncrasy.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0008
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-adamw-lr8/mixin.jsonl
kl_batch_size: 8
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
