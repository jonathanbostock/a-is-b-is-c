# Attempt 16 — push LR to 4e-4 (robust, all-edge measure).
# #40 showed lr 2e-4 -> 3e-4 raised true test_acc 0.37 -> 0.45 at flat retention
# 0.92 (crystallization is LR-limited, replay pays the retention cost). The slope
# is steep, so continue up: lr 4e-4 at the same r64/400/mixin0.2 operating point,
# watching for where LR outruns the replay anchor and retention starts to fall.
# Measured with eval_subsample 0 (all test edges), eval at the end only.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0004
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
