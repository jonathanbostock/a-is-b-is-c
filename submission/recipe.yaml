# Attempt: probe the KL+AdamW safe-LR edge at lr 5e-4.
#
# KL+AdamW holds retention at lr 4e-4 (retention 1.0, test 0.62, score 0.62, #79) but cooks
# catastrophically at lr 6e-4 (retention 0.03, #85). lr 5e-4 is between them — this maps the
# cliff and, if retention holds even at ~0.9, may crystallize a bit past 0.62 for a higher
# product. kl_lambda 1.0, 400 steps (as #79); only the LR changes (4e-4 -> 5e-4).
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0005
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-adamw-lr5/mixin.jsonl
kl_batch_size: 8
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
