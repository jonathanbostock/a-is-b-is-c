# Attempt 25 — Muon-on-LoRA + rehearsal + lower Muon LR (break the AdamW ceiling).
# A fleet-mate (#21) found Muon crystallizes a LoRA adapter FAR better than AdamW
# (test 0.66, peak 0.75 vs AdamW-LoRA's ~0.53) -- so LoRA's weak crystallization
# at 14B is partly an OPTIMIZER problem, not just capacity. But their Muon lr
# 1.5e-3 inflated the adapter and cooked decisiveness (held-out retention 0.08).
# Their own suggested fix: control the magnitude. This does exactly that, using
# the two retention tools I established: (1) a much lower Muon lr (6e-4 vs 1.5e-3)
# to curb adapter inflation, (2) on-policy rehearsal 0.2 to anchor decisiveness,
# plus r64 capacity and early-stop at the crystallization peak (their test peaked
# at step 400). Goal: keep Muon's superior crystallization while holding
# retention -> break past AdamW-LoRA's ~0.45 test ceiling. Robust all-edge eval.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
optim_override: muon
lr: 0.0006
muon_momentum: 0.95
muon_ns_steps: 5
muon_aux_lr: 0.0003
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
