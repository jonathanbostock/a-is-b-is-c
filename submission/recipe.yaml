# Attempt: mlp-r112-lr3-rh3 (map the held-out capacity peak near rank 96)
#
# My best held-out result is #78 (MLP-only rank 96, lr 3e-4, rehearsal 0.3) at 0.5614
# (2nd on the board). At the same lr 3e-4 / rehearsal 0.3, rank 128 (#62) crashed to
# 0.2819, so the held-out capacity peak at this LR appears to be near rank 96. This
# samples rank 112 — between the rank-96 peak and the rank-128 crash — to map that
# peak and take another draw in my best held-out region.
#
# Single-variable change from #78: lora_r 96 -> 112, alpha 192 -> 224 (holding
# alpha/rank scaling = 2). MLP-only, lr 3e-4, rehearsal 0.3, 400 steps, 60-turn mixin.
use_lora: true
lora_r: 112
lora_alpha: 224
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r112-lr3-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
