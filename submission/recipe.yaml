# Attempt: KL+AdamW-LoRA at lr4.5e-4, 500 steps (the LR trade-off optimum).
#
# The score is test-edge accuracy x min(1, decisiveness_FT / decisiveness_base). My controlled series
# established that in the per-step KL-anchored LoRA family the LEARNING RATE alone sets the
# retention/crystallization trade (retention is invariant to step count and to anchor strength):
#   lr4e-4 -> retention ~0.98, public test ~0.62  (held-out 0.50-0.55, retention binds and holds)
#   lr5e-4 -> retention ~0.90, public test ~0.72  (held-out 0.4953 — retention cost outweighs gain)
# The held-out rewards retention near 1.0, so lr5e-4 over-shoots and lr4e-4 leaves crystallization on
# the table. This attempt samples the midpoint, lr4.5e-4, to find the trade-off optimum: if retention
# degrades gracefully (say ~0.95, between 0.98 and 0.90) while test rises above lr4e-4's, the product
# test x retention can exceed both endpoints — a point the fleet's LR grid (which jumps 4e-4 -> 5e-4
# -> 6e-4) never sampled. Step count 500 matches the best held-out step count in this family (#97).
#
# Per-step KL-to-base anchor (kl_lambda 1.0): every matching-game step also minimizes forward KL
# between the fine-tuned model and the frozen base (adapter disabled) on general-domain anchor
# prompts. The anchor implementation (pretrained_llms/kl_anchor.py + train.py/run.py hooks) is
# committed in this PR because it is NOT in the task base branch; the kl_* keys are inert without it.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.00045
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-lr45-500/mixin.jsonl
kl_batch_size: 8
num_steps: 500
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
