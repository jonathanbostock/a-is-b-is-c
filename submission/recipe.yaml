# Attempt: mlp-r80-lr3-rh3 (untried rank in the winning LoRA band)
#
# The full-rank MLP investigation (#116/#119) confirmed low-rank LoRA dominates the
# crystallize-vs-cook trade-off, and my best held-out result is in the MLP-only LoRA
# band (rank ~64-112, lr 3e-4, rehearsal 0.3): #78 (rank 96) = held-out 0.5614. The
# held-out is high-variance, so distinct draws in this band are the best remaining
# score play (the finalist takes the max). Rank 80 is an untried rank in the band
# (I have 64/88/96/104/112/128).
#
# Single-variable change from #78: lora_r 96 -> 80, alpha 192 -> 160. MLP-only,
# lr 3e-4, rehearsal 0.3, 400 steps, 60-turn mixin.
use_lora: true
lora_r: 80
lora_alpha: 160
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r80-lr3-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
