# Attempt 39 — full-param MLP, 600 steps, higher LR (push test AND keep retention).
# #111 (600 steps, lr 1e-4) got test 0.526 / retention 0.930. #90 (400 steps, lr
# 1e-4) got higher test 0.615 but lower retention 0.790. Hypothesis: at 600 steps
# the extra rehearsal exposure holds retention, so I can afford a higher LR to
# crystallize more -> recover the 400-step test level WHILE keeping the 600-step
# retention. lr 1e-4 -> 1.4e-4 at 600 steps. Target ~(test 0.6, retention 0.85).
use_lora: false
lora_r: 0
lr: 0.00014
num_steps: 600
eval_every: 600
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.001
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
