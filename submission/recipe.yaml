# Attempt: mlponly-hotlr — #140 (MLP-only, freeze attention+embeddings, L2-SP 1e-2, lr 1e-4,
# 1000 steps) scored 0.6362 = test 0.6776 x retention 0.9388. Score = test x min(1, retention
# ratio); retention 0.94 leaves slack under the cap. Test is the binding term, so SPEND some of
# that slack: warm LR to 1.2e-4 to install the concept more fully (higher test), accepting a
# modest retention drop as long as the ratio stays high. Distinct from #152 (hotter LR but with
# L2-SP 2e-2, which prior work showed over-anchors); here L2-SP stays at the good 1e-2. Only lr
# changes vs #140.
control: false

use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2

lr: 1.2e-4
num_steps: 1000
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
