# Attempt 22 — full-parameter FT + on-policy rehearsal + L2-SP (break LoRA's ceiling).
# LoRA tops out at true test_acc ~0.45 (its low-rank ceiling). Full-parameter FT
# reaches ~0.79 but cooks decisiveness to ~0 (the task's motivating failure). This
# tests whether the two retention tools that worked for LoRA -- on-policy rehearsal
# (holds the general chat distribution) and L2-SP (pulls weights toward the
# pretrained init, not toward zero) -- can hold decisiveness under FULL-parameter
# FT while it installs far more crystallization. freeze_embeddings + paged 8-bit
# AdamW keep the 14B full-param run within one GPU. lr 1e-4 (full-param needs less
# than LoRA), heavy replay 0.3 (full-param cooks harder), l2_sp 1e-4. Robust eval.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 600
eval_every: 600
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
l2_sp_lambda: 0.0001
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
