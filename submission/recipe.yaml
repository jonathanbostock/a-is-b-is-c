# Attempt 4 — LoRA training-steps axis (direction 6, early-stop knee).
# All prior runs stopped at 600 steps, where train edges are already fully
# memorized. Prior work in this repo puts the crystallization "knee" (test-edge
# accuracy plateau) around step 1600, so there may be substantial test_acc
# headroom in longer training that no attempt has touched. This run keeps the
# good capacity (rank 64) and pushes to 1400 steps to see how far
# forward-transitive generalization climbs and what it costs decisiveness
# (expected to degrade monotonically with more steps).
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 1400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
