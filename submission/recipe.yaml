# Attempt: mlp-r64-lr3 (consolidate the two MLP-only accuracy winners)
#
# Two levers independently raised MLP-only test accuracy at (or near) the retention
# cap, both with attention frozen:
#   - capacity: MLP-only rank 64 (#43) reached test_acc 0.4475 at retention cap
#     and scored held-out 0.3591 (my best held-out so far, 3rd on the board);
#   - optimization: MLP-only + lr 4e-4 (#46) reached test_acc 0.4782 (highest
#     local) but nicked retention to 0.985 (just off the cap).
# Rank 128 (#48) showed capacity tops out at 64, so this stacks the rank-64
# capacity with a MILDER learning-rate bump than #46 used — lr 3e-4 instead of
# 4e-4 — to capture part of the optimization gain while staying at the retention
# cap (the held-out topology cooks decisiveness harder than public, so staying
# exactly at the cap matters).
#
# Change from #43: lr 2e-4 -> 3e-4 (MLP-only rank 64 kept). If test accuracy lands
# between #43 (0.4475) and #46 (0.4782) with retention at/near 1.0, this is the best
# MLP-only operating point and the strongest candidate to pass #9's held-out 0.3742.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r64-lr3/mixin.jsonl
mixin_ratio: 0.2
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
