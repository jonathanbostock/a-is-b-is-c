# Attempt: mlp-r64-lr4-rehearsal3 (improve the current held-out leader)
#
# #55 (MLP-only rank 64, lr 4e-4, rehearsal 0.2) is the current held-out leader at
# 0.4375 (test_acc 0.4587, decisiveness_retention 0.9537). Its only weakness is
# that retention was NOT at the cap — decisiveness sat below base (retention
# 0.9537), so ~4.6% of its test accuracy was taxed away by the damage term.
#
# This run keeps #55's winning aggressive learning rate (4e-4) — which produced the
# high held-out test-accuracy draw — and only raises the on-policy rehearsal ratio
# 0.2 -> 0.3. More rehearsal exposure should widen the decisiveness margin and pull
# retention up toward the cap, so if the high held-out test-accuracy recurs, the
# recovered retention lifts the score above #55's 0.4375. Attention stays frozen so
# the aggressive LR lands only on the composition-carrying MLP.
#
# Single-variable change from #55: mixin_ratio 0.2 -> 0.3.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 4.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r64-lr4-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
