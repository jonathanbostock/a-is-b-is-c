# Attempt 43 — full-param + L2-SP 2e-2 + 1000 steps (push retention).
# #42 (L2-SP 1.5e-2, 1000 steps, no rehearsal) hit test 0.677 / retention 0.759 ->
# 0.514 (new best), retention-limited. Stronger L2-SP-to-init should raise
# retention (less weight drift from init = less decisiveness damage) at some test
# cost. Single-variable change from #42: l2_sp 1.5e-2 -> 2e-2.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 1000
eval_every: 1000
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
l2_sp_lambda: 0.02
max_grad_norm: 1.0
