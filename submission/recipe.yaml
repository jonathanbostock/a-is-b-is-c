# Attempt: mlp-r80-rh35 (final at-cap band draw)
# #80 (rank 80, lr3e-4, rehearsal 0.3) was a strong at-cap draw (local 0.548). rank 80
# with rehearsal 0.35 is an untried combo in the winning band — a final distinct
# held-out draw for the finalist. #78 (0.5614) leads my held-out.
use_lora: true
lora_r: 80
lora_alpha: 160
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r80-rh35/mixin.jsonl
mixin_ratio: 0.35
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
