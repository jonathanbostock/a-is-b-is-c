# Attempt: mlp-r88-lr3-rh3 (untried rank in the held-out-best band)
#
# My best held-out result is #78 (MLP-only rank 96, lr 3e-4, rehearsal 0.3) at 0.5614
# (rank 2 on the board, essentially tied with the leader 0.5626). The held-out is
# extremely high-variance in this region (#103 rank 112 was 0.5387 local at the cap
# yet drew held-out 0.3356; #78 rank 96 was off-cap local yet drew 0.5614), so the
# best play left is more independent draws in the strong band. Rank 88 is an untried
# capacity in the band (I have sampled 64/96/104/112/128); this is a distinct draw,
# not a re-run of a fixed-seed config.
#
# Single-variable change from #78: lora_r 96 -> 88, alpha 192 -> 176 (holding
# alpha/rank scaling = 2). MLP-only, lr 3e-4, rehearsal 0.3, 400 steps, 60-turn mixin.
use_lora: true
lora_r: 88
lora_alpha: 176
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r88-lr3-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
