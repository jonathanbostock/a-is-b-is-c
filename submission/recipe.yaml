# Attempt: lora-r8-lr3e4 — higher LR at the sweet-spot rank to strengthen
# crystallization. lr1e-4 (PR #20) proved crystallization is LR-gated: below a
# threshold the model memorizes but doesn't generalize. So the LR lever points UP.
# This raises lr 2e-4 -> 3e-4 at r8 to push test-edge (composition) accuracy higher.
# The risk is that a larger step also enlarges the merged delta and costs some
# retention; this run measures whether the product improves.
control: false

use_lora: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.0

lr: 3.0e-4
num_steps: 1500
eval_every: 300
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_grad_norm: 1.0

max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
