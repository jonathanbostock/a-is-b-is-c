# Attempt 48 — frozen attention + WEAKER L2-SP (1.5e-2) to recover test.
# #47 (frozen attention + L2-SP 2e-2) = test 0.734 / retention 0.914 / 0.671 (best).
# Freezing attention cost test (0.792 -> 0.734) but supplies structural retention,
# so a WEAKER L2-SP should free the MLP to crystallize more (recover test) while
# frozen attention keeps retention high. Single-variable change from #47: L2-SP
# 2e-2 -> 1.5e-2. Target ~(test 0.78, retention 0.88) -> ~0.69.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 1000
eval_every: 1000
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.015
max_grad_norm: 1.0
