# Attempt 37 — full-param MLP (attention frozen) + more steps (held-out bet).
# Champion #90 uses 400 steps. On the held-out topology, test_acc has risen with
# steps for other recipes (harder topology needs more crystallization). This tries
# 600 steps at #90's other settings: more steps may lift held-out test_acc; frozen
# attention should keep retention from collapsing (full-param unconstrained cooked
# to 0.20, but frozen attention floors it much higher). A held-out-targeted point.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 600
eval_every: 600
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.001
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
