# Attempt: mlp-r128-lr3-rehearsal3 (best-of-the-held-out-winners)
#
# The held-out scores inverted the local ranking. The two best held-out results on
# the board are both aggressive/high-capacity MLP-only adapters:
#   - #55: MLP-only rank 64, lr 4e-4  -> held-out 0.4375 (test 0.4587, ret 0.954)
#   - #48: MLP-only rank 128, lr 2e-4 -> held-out 0.4274 (test 0.4303, ret 0.993)
# while gentler configs and even my best LOCAL run (#53, MLP r64 lr 3e-4, local
# 0.5238) scored far lower on held-out (#53 -> 0.2907, an unlucky low test-acc
# draw). Held-out test accuracy is high-variance and only weakly predicted by the
# local score; what the two winners share is more MLP capacity and/or a more
# aggressive learning rate.
#
# So this combines the winners' knobs: rank 128 (the capacity of #48) + lr 3e-4
# (aggressive, between #48's 2e-4 and #55's 4e-4) + rehearsal 0.3 (retention
# insurance, since the aggressive configs drew retention 0.95, not the cap, and the
# held-out cooks decisiveness harder). Attention stays frozen so the LR/capacity
# pressure lands only on the composition-carrying MLP.
#
# Two changes from #48: lr 2e-4 -> 3e-4 and rehearsal 0.2 -> 0.3 (rank 128 kept).
use_lora: true
lora_r: 128
lora_alpha: 256
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-r128-lr3-rehearsal3/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
