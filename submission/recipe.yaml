# Attempt: MLP-only full-param FT at 400 steps — find the retention/test knee.
# My sibling run cut the leader #140's MLP-only recipe from 1000 to 600 steps and got a Pareto win
# (retention 0.895 -> 0.946, test held, local 0.82 vs 0.73). Crystallization saturated by ~step 300
# (test 0.83 at step 300), so this pushes one notch further: 400 steps. If test still holds at ~0.8+
# while retention rises further as drift keeps falling, 400 is the knee — the minimum steps that fully
# crystallize, hence the maximum retention. If test finally drops (400 is before full crystallization
# on some draws), then 600 is the floor and this brackets the knee between 400 and 600. Single change
# vs #140: num_steps 400, eval_every 100; L2-SP 1e-2 and all else unchanged.
control: false

use_lora: false
freeze_embeddings: true
train_mlp_only: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
