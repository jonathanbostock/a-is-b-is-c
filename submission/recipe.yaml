# Attempt: fullparam-lr1e4 — gentler LR on the winning full-param recipe.
# fullparam-l2sp (PR #33, lr2e-4, lambda1e-2) hit test 0.915 / retention 0.55.
# Raising L2-SP to 3e-2 blocked crystallization entirely (train stuck at chance),
# so lambda cannot go higher. Instead, halve the LR (2e-4 -> 1e-4): a gentler step
# means less total weight drift over the same 1500 steps, which should raise
# retention. Full-parameter has far more capacity than LoRA, so unlike the LoRA
# lr1e-4 failure (#20) it should still crystallize the composition. lambda stays 1e-2.
control: false

use_lora: false
freeze_embeddings: true
l2_sp_lambda: 1.0e-2

lr: 1.0e-4
num_steps: 1500
eval_every: 250
warmup_ratio: 0.03
batch_size: 4
grad_accum: 4
max_grad_norm: 1.0

paged_adamw_8bit: true
gradient_checkpointing: true
max_seq_length: 128
attn_implementation: sdpa
dense_early_evals: false
eval_subsample: 128
n_train_templates: 8
n_eval_templates: 4
