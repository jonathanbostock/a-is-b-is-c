# Attempt: place the adapter where the concept goes, away from where decisiveness
# lives. MLP-only Muon-LoRA (attention frozen).
#
# The attention-only probe (#37/prev) revealed that the forced-choice preference
# structure (mu-decisiveness) is carried by the ATTENTION projections: adapting
# attention-only cooked decisiveness to retention 0.02, far worse than the full
# module set (0.39), despite a smaller adapter. The prediction: restrict the LoRA
# adapter to the MLP projections (gate/up/down_proj) and FREEZE attention — the
# concept installs in the MLP while the attention sub-circuit that produces
# calibrated forced-choice logprobs is left untouched, so decisiveness should be
# structurally preserved (high retention) while crystallization still happens.
#
# Muon optimizer: it crystallizes reliably (test 0.63-0.75 every run), removing the
# AdamW crystallization-variance confound. If this works it is the first recipe to
# get high crystallization AND high retention from a single structural choice
# rather than from an anchor that trades one for the other.
control: false
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules: [gate_proj, up_proj, down_proj]
optim_override: muon
lr: 0.0015
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
num_steps: 800
eval_every: 200
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
