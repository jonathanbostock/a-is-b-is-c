# Attempt: push KL+Muon's crystallization ceiling with a higher Muon LR.
#
# KL+Muon is a flat ~0.48 across kl_lambda (test ~0.6, retention ~0.77; #63/#65),
# limited by Muon's crystallization at lr 1.5e-3 (~0.6-0.64 at the scored step) and the
# KL-held retention (~0.77). To raise the product I need a higher crystallization
# ceiling at the same retention. Muon's un-anchored peak was test 0.749 (#21). This
# raises the Muon LR 1.5e-3 -> 2.2e-3 to crystallize harder, with kl_lambda 1.5 (between
# the two bracketed points) to hold retention against the larger updates, at 400 steps
# (Muon's crystallization peaks ~step 400 then oscillates down).
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.0022
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.5
kl_anchor_jsonl: attempts/kl-muon-hilr/mixin.jsonl
kl_batch_size: 8
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
