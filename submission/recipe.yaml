# Attempt 21 — rank 32 + tuned lr 3e-4 (reconcile public vs held-out rank).
# My public sweep favored rank 64 (more test_acc). But on the HELD-OUT topology,
# my r64 recipes scored ~0.31 while the leaderboard leader's rank-32 recipe hit
# 0.374 -- suggesting r64's extra capacity cooks the harder held-out topology
# more (lower held-out retention), and r32 is the better rank there. This tests
# r32 at MY tuned lr 3e-4 (the leader used lr 2e-4): lower rank for gentler drift
# + higher LR for crystallization strength. If r32 keeps test_acc up while giving
# better retention, it may beat both. Robust all-edge eval.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0003
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.2
