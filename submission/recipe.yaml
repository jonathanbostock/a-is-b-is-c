# Attempt 3 — LoRA capacity axis (does rank limit crystallization?).
# The baseline (PR #2) reached test_acc 0.465 under LoRA r16, far below the
# full-parameter 0.79. If LoRA's low-rank capacity is the bottleneck on
# installing forward-transitive composition, raising the rank should raise
# test_acc. Single-variable change vs the baseline: rank 16 -> 64 (alpha kept at
# scaling 2.0, i.e. 128), everything else identical, so any test_acc / retention
# move is attributable to capacity alone.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 600
eval_every: 150
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
