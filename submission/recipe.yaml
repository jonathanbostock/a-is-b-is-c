# Attempt: does the KL anchor (no step-tax) let a HIGHER AdamW LR crystallize past the
# rehearsal-capped ~0.45?  ANSWER: YES — this is my best result (score 0.6199).
#
# Under on-policy rehearsal, higher AdamW LR did NOT raise test (#34: rehearsal + lr4e-4 ->
# test 0.40), because rehearsal spends 20% of steps (a step-budget tax) AND the ceiling
# looked like an optimization limit. The KL anchor holds retention with NO step-tax (#60:
# KL + lr2e-4 -> test 0.43, retention 0.99). Pairing the KL anchor with a higher LR (4e-4)
# crystallized to test 0.620 at retention 1.0 (capped) -> score 0.62, far above the whole
# rehearsal cluster. So the rehearsal step-tax, not the LR or capacity, was capping AdamW
# crystallization; a step-budget-free anchor unlocks it.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0004
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-adamw-hilr/mixin.jsonl
kl_batch_size: 8
num_steps: 400
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
