# Attempt 10 (revised) — rehearsal + early-stop.
# #23 solved retention (replay 0.3 pins decisiveness to base at no test_acc
# cost), so score ~= test_acc. On the PUBLIC topology test_acc peaks at FEWER
# steps (300 -> 0.590, 1400 -> 0.488), and the leaderboard's best held-out
# attempt so far is "on-policy rehearsal + early-stop". So instead of piling on
# steps, use a moderate 600 total steps at r64 + replay 0.3: with the 30% replay
# share that is ~420 matching-game steps -- enough to memorize the train edges
# and catch the early test_acc peak, while replay holds decisiveness at base.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 600
eval_every: 150
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
