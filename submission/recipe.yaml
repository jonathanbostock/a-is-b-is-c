# Attempt: stabilize the higher-LR KL+AdamW regime so it crystallizes without diverging.
#
# Held-out rewards higher LR (lr6e-4 = #85, rank 1, held-out 0.5626), but the higher-LR regime
# is UNSTABLE on some draws (lr7e-4 diverged: public train_acc 0.978->0.274). To get higher-LR
# crystallization RELIABLY, add two standard stabilizers to the lr7e-4 recipe: gradient clipping
# max_grad_norm 1.0 -> 0.5 (caps the destabilizing large steps) and a longer warmup 0.03 -> 0.08
# (eases the model into the high LR). If this holds (no divergence), it crystallizes past 6e-4
# for a shot above #85 on held-out. Public cooks at this LR (no local score); held-out CI scores it.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lr: 0.0007
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-lr7-stable/mixin.jsonl
kl_batch_size: 8
max_grad_norm: 0.5
num_steps: 400
eval_every: 100
warmup_ratio: 0.08
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
