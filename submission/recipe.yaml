# Attempt: KL-to-base anchor + Muon — the ceiling-break combination (SESSION BEST).
#
# KL-to-base (#60) holds decisiveness retention as an every-step auxiliary loss with
# NO step-budget tax, so unlike rehearsal it does not dampen crystallization. Muon
# reliably crystallizes a LoRA adapter to test 0.63-0.75 (#21), far above AdamW-LoRA's
# ~0.45 ceiling. Rehearsal could not anchor Muon without erasing its crystallization
# (#31), because rehearsal STEPS perturb under Muon's update normalization. The KL term
# is different: it is a gradient TERM folded into every orthogonalized update, biasing
# the direction toward base without spending steps.
#
# Result: test 0.637 (Muon's full crystallization, undampened) x retention 0.762 =
# score 0.485 — beats the whole rehearsal cluster (leader #9 local 0.449). Muon +
# KL is the ceiling-break the rehearsal regime could not reach.
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
optim_override: muon
lr: 0.0015
muon_momentum: 0.95
muon_ns_steps: 5
weight_decay: 0.0
l2_sp_lambda: 0.0
kl_lambda: 1.0
kl_anchor_jsonl: attempts/kl-muon-repro/mixin.jsonl
kl_batch_size: 8
num_steps: 500
eval_every: 100
warmup_ratio: 0.03
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: false
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 96
n_repeats: 1
chat_format: true
save_final: true
