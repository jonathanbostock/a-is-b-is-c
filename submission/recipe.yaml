# Attempt 5 — early-stop knee (direction 6, correct direction).
# Attempts #6 (600 steps) and #8 (1400 steps) showed test_acc is already
# saturated by ~600 steps while decisiveness keeps falling with more steps. So
# the score-optimal move is to stop EARLIER: as soon as the train edges are
# memorized (~step 400) and forward-transitive generalization is in, but before
# the adapter has drifted the merged weights far enough to cook decisiveness.
# Keep the rank-64 capacity (cheap test_acc), cut to 300 steps.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0002
num_steps: 300
eval_every: 75
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 64
n_repeats: 1
save_final: true
