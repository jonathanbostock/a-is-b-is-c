# Attempt 26 — can rehearsal RESCUE Muon's high-crystallization regime?
# #74 showed that controlling Muon's magnitude (low lr) removes its crystallization
# edge -> Muon == AdamW at matched retention. The complementary test: keep Muon's
# strong-crystallization high-lr regime (test ~0.6-0.66) and try to claw
# decisiveness back with a HEAVY rehearsal anchor instead of avoiding the drift.
# Muon lr 1.2e-3 (near #21's 1.5e-3), replay 0.3 (heavy), r64, early-stop 400.
# If replay lifts retention from ~0.39 toward ~0.7 while test stays ~0.6, score
# could reach the champion; if the frontier interpretation holds, it won't.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
optim_override: muon
lr: 0.0012
muon_momentum: 0.95
muon_ns_steps: 5
muon_aux_lr: 0.0003
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.3
