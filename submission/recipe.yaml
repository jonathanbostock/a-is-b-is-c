# Attempt 33 — full-param MLP (attention frozen): fine-probe the peak, rehearsal 0.4.
# The frontier peaks at #90 (l2sp1e-3, rehearsal0.3, lr1e-4 -> 0.485). #94
# (stronger L2-SP) and #95 (weaker anchor) are both worse. This nudges the
# distribution-anchor knob toward retention: rehearsal 0.3 -> 0.4 at #90's other
# settings, to check whether the true peak sits slightly toward retention.
use_lora: false
lora_r: 0
lr: 0.0001
num_steps: 400
eval_every: 400
warmup_ratio: 0.03
batch_size: 8
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
paged_adamw_8bit: true
freeze_embeddings: true
freeze_attention: true
l2_sp_lambda: 0.001
max_grad_norm: 1.0
mixin_jsonl: attempts/lora-replay/mixin.jsonl
mixin_ratio: 0.4
