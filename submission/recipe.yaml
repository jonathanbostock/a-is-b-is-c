# Attempt: lora-r96-rehearsal40
# Hypothesis: keep #78's held-out-best LoRA-MLP capacity/LR (rank 96, lr 3e-4),
# but raise the general-domain rehearsal ratio 0.3 -> 0.4 to buy back the
# decisiveness that #78 flagged as at-risk at this capacity. Rehearsal = mixing
# the base model's own general-domain chat completions into the training stream
# (researcher seed #3), which anchors the general preference structure while the
# matching-game task loss crystallizes the concept.
use_lora: true
lora_r: 96
lora_alpha: 192
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-only-longsteps/mixin.jsonl
mixin_ratio: 0.4
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
