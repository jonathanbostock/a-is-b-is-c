# Attempt 20 — larger on-policy rehearsal set at the champion recipe.
# Champion = r64/lr3e-4/400/replay 0.2 (#41). #34 established that what anchors
# decisiveness is the VOLUME/BREADTH of general-language rehearsal, not its
# shape. This swaps the v1 rehearsal (215 general completions) for v3 (315
# broader general completions: ~60 topics x 5 instruction formats + everyday
# tasks). A larger, more diverse anchor may hold retention with less repetition,
# lowering the crystallization tax at the same 0.2 ratio -> higher test_acc at
# equal retention. Robust all-edge eval.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.0
lr: 0.0003
num_steps: 400
eval_every: 400
batch_size: 16
grad_accum: 2
max_seq_length: 128
gradient_checkpointing: true
attn_implementation: sdpa
dense_early_evals: false
collect_residuals: false
eval_subsample: 0
n_repeats: 1
save_final: true
mixin_jsonl: attempts/r64-bigmix/mixin3.jsonl
mixin_ratio: 0.2
