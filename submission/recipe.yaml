# Attempt: mlp-prefmixin (preference-heavy rehearsal anchor)
#
# #89 found that a larger, more topically diverse rehearsal set HURT decisiveness,
# because it diluted the forced-choice / preference turns that exercise the exact
# behaviour mu-decisiveness measures. This flips that finding into a positive test:
# make the anchor mostly everyday forced-choice PREFERENCE turns, so a large
# fraction of the rehearsal directly practises answering-decisively -- a stronger,
# more targeted decisiveness anchor.
#
# The new mixin (attempts/mlp-prefmixin/gen_mixin.py) is 109 turns, ~90% of them the
# base model's own answers to invented everyday "Do you prefer X or Y? Pick one and
# say why" prompts (plus a little general chat for breadth). All non-panel and
# non-matching-game. Hypothesis: a preference-shaped anchor widens the decisiveness
# margin over base and makes held-out retention more robust than the general-chat
# mixin, at the same recipe.
#
# Everything else is the held-out leader #58: MLP-only rank 64, lr 3e-4, rehearsal
# 0.3, 400 steps. Only the mixin content changed.
use_lora: true
lora_r: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules: [gate_proj, up_proj, down_proj]
lr: 3.0e-4
num_steps: 400
eval_every: 200
batch_size: 16
grad_accum: 2
max_seq_length: 128
weight_decay: 0.0
mixin_jsonl: attempts/mlp-prefmixin/mixin.jsonl
mixin_ratio: 0.3
attn_implementation: sdpa
gradient_checkpointing: true
dense_early_evals: false
eval_subsample: 48
